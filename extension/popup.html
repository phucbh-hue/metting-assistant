<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { margin: 8px 0; }
  label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
  select, input, button { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 13px; border-radius: 7px;
    border: 1px solid #bbb; background: Field; color: FieldText; }
  button { cursor: pointer; border-color: #7c3aed; background: #7c3aed; color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: #7c3aed; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: #777; font-size: 12px; }
  .err { color: #c0392b; font-size: 12px; }
  .ok { color: #1a7f37; font-size: 12px; }
  .split { display: flex; gap: 8px; }
  .split > * { flex: 1; }
  hr { border: none; border-top: 1px solid #0002; margin: 12px 0; }
</style>
</head>
<body>
  <h1>Meeting Copilot - thu tiếng tab</h1>
  <div class="row" id="auth"><span class="muted">Đang kiểm tra quyền...</span></div>

  <div id="pick">
    <div class="row">
      <label>Cuộc họp nhận lời thoại</label>
      <select id="meeting"><option value="">Đang tải...</option></select>
    </div>
    <div class="row split">
      <button class="ghost" id="refresh">Lấy lại quyền / tải lại</button>
    </div>
    <div class="row">
      <label>Hoặc tạo cuộc họp mới</label>
      <input id="newTitle" placeholder="Tên cuộc họp" maxlength="200">
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="micOn" checked style="width:auto">
        <span>Thu cả tiếng tôi nói (mic) - lần đầu cần cấp quyền micro</span>
      </label>
    </div>
    <div class="row">
      <button id="start">Bắt đầu nghe</button>
    </div>
    <div class="row muted">Mở popup ngay trên tab đang họp (Google Meet, Teams, Zoom web...). Extension thu tiếng người
      online (qua tab) và tiếng anh chị nói (mic). Nên đeo tai nghe để tiếng họp không vọng vào mic.</div>
  </div>

  <div id="live" style="display:none">
    <div class="row ok" id="liveInfo">Đang nghe.</div>
    <div class="row muted" id="liveStats"></div>
    <div class="row"><button id="stop">Dừng nghe</button></div>
  </div>

  <div class="row" id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
