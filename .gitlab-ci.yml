# CI/CD cho GitLab nội bộ (git.urbox.vn/external-engineer/meeting-copilot) - bản 3.30.0, 16/11/2026.
#
# Ba bước: test -> build image (đẩy vào Container Registry của dự án) -> deploy lên server nhà mình qua SSH (bấm tay).
# Server chỉ chạy MỘT bản (phòng họp đang diễn ra nằm trong bộ nhớ), nên deploy = kéo image mới, dừng container cũ, chạy
# container mới; cuộc họp đang diễn ra lúc đó bị ngắt vài chục giây (extension / bot tự nối lại).
#
# Biến CI/CD cần đặt ở Settings > CI/CD > Variables (Masked, Protected):
#   DEPLOY_HOST      địa chỉ server (ví dụ 10.0.0.12 hoặc meeting.urbox.vn)
#   DEPLOY_USER      người dùng SSH trên server, thuộc nhóm docker
#   DEPLOY_SSH_KEY   khóa SSH riêng (dạng File), khóa công khai nằm trong ~/.ssh/authorized_keys của DEPLOY_USER
#   DEPLOY_DIR       thư mục trên server chứa prod.env (mặc định /opt/meeting-copilot)
# Trên server tạo sẵn $DEPLOY_DIR/prod.env (xem deploy/prod.env.example). Không bao giờ đưa .env vào repo.
# Dự án cần ít nhất một GitLab Runner có Docker (executor docker, privileged cho bước build) - Settings > CI/CD > Runners.

stages: [test, build, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  # Bớt dung lượng image khi build thử: đặt WITH_OFFICE=0 / WITH_SUBSCRIPTION_CLI=0 / WITH_LOCAL_TTS=0 ở Run pipeline.
  WITH_OFFICE: "1"
  WITH_SUBSCRIPTION_CLI: "1"
  WITH_LOCAL_TTS: "1"
  WITH_BROWSER: "0"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------- test ---
test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  variables:
    PYTHONIOENCODING: utf-8
    PYTHONUTF8: "1"
    CLAUDE_EFFORT: ""            # tránh biến môi trường của máy dev lọt vào test
    MONGODB_URL: ""              # test dùng mongomock, không nối Atlas
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libsndfile1 && rm -rf /var/lib/apt/lists/*
    - pip install -r requirements.txt
  script:
    - python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tail -40
    - node --version >/dev/null 2>&1 || true
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths: [data/]
  interruptible: true

# --------------------------------------------------------------- build ---
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE:latest" || true
    - >
      docker build
      --cache-from "$IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg WITH_OFFICE=$WITH_OFFICE
      --build-arg WITH_SUBSCRIPTION_CLI=$WITH_SUBSCRIPTION_CLI
      --build-arg WITH_LOCAL_TTS=$WITH_LOCAL_TTS
      --build-arg WITH_BROWSER=$WITH_BROWSER
      -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$IMAGE:latest" "$IMAGE:$CI_COMMIT_TAG" && docker push "$IMAGE:$CI_COMMIT_TAG"; fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# -------------------------------------------------------------- deploy ---
# Bấm tay (manual) ở trang Pipelines: kéo image vừa build về server, thay container, chờ /healthz trả đúng số bản.
deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  variables:
    GIT_STRATEGY: none
    TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - export DEPLOY_DIR="${DEPLOY_DIR:-/opt/meeting-copilot}"
    - >
      ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "
      set -e;
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY';
      docker pull '$IMAGE:$TAG';
      test -f '$DEPLOY_DIR/prod.env' || { echo 'thiếu $DEPLOY_DIR/prod.env (xem deploy/prod.env.example)'; exit 1; };
      docker rm -f meeting-copilot 2>/dev/null || true;
      docker run -d --name meeting-copilot --restart unless-stopped
        -p 8080:8080
        -v meeting-data:/app/data
        --env-file '$DEPLOY_DIR/prod.env'
        --memory 3g
        '$IMAGE:$TAG';
      for i in \$(seq 1 30); do sleep 5; curl -fsS http://127.0.0.1:8080/healthz && break; done;
      curl -fsS http://127.0.0.1:8080/healthz;
      docker image prune -f >/dev/null"
  environment:
    name: production
    url: $PUBLIC_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
