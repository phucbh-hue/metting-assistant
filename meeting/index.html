<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meeting Copilot - UrBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233DDC97' stroke-width='2' stroke-linecap='round'%3E%3Crect x='9' y='3' width='6' height='11' rx='3'/%3E%3Cpath d='M5 11a7 7 0 0 0 14 0M12 18v3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'] },
          colors: {
            ink: 'rgb(var(--ink) / <alpha-value>)',
            muted: 'rgb(var(--muted) / <alpha-value>)',
            accent: 'rgb(var(--accent) / <alpha-value>)',
            live: 'rgb(var(--live) / <alpha-value>)',
            danger: 'rgb(var(--danger) / <alpha-value>)',
            panel: 'rgb(var(--panel) / <alpha-value>)',
            base: 'rgb(var(--base) / <alpha-value>)',
          }
        }
      }
    };
    if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
  </script>
  <style>
    :root {
      --base: 11 15 18;      /* nền */
      --panel: 21 27 33;     /* bề mặt */
      --raise: 28 35 43;     /* bề mặt nổi (menu, modal) */
      --ink: 233 238 241;    /* chữ chính */
      --muted: 141 153 165;  /* chữ phụ */
      --accent: 61 220 151;  /* hành động chính */
      --live: 184 240 90;    /* đang ghi */
      --danger: 255 107 107;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: rgb(var(--base)); color: rgb(var(--ink));
      font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(1200px 600px at 85% -10%, rgba(61, 220, 151, 0.06), transparent 60%);
    }
    .num { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); background-clip: padding-box; }
    :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 8px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* --------- khung ứng dụng --------- */
    .rail { border-top: 1px solid var(--line); }
    @media (min-width: 640px) { .rail { width: 64px; border-top: 0; border-right: 1px solid var(--line); } }
    .rail-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: rgb(var(--muted)); transition: background .15s, color .15s; }
    .rail-btn:hover { color: rgb(var(--ink)); background: rgba(255,255,255,.06); }
    .rail-btn[aria-current="page"] { color: rgb(var(--base)); background: rgb(var(--ink)); }
    .rail-btn[disabled] { opacity: .35; pointer-events: none; }
    .panel { background: rgb(var(--panel) / .82); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(18px); }
    .divider { border-color: var(--line); }

    /* --------- nút --------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px; border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s, transform .05s; white-space: nowrap; }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: .45; pointer-events: none; }
    .btn-primary { background: rgb(var(--accent)); color: #04130c; }
    .btn-primary:hover { background: rgb(var(--accent) / .88); }
    .btn-ghost { background: rgba(255,255,255,.04); border-color: var(--line-strong); color: rgb(var(--ink)); }
    .btn-ghost:hover { background: rgba(255,255,255,.08); }
    .btn-danger { background: rgb(var(--danger) / .12); border-color: rgb(var(--danger) / .35); color: rgb(var(--danger)); }
    .btn-danger:hover { background: rgb(var(--danger) / .2); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
    .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: rgb(var(--muted)); }
    .icon-btn:hover { color: rgb(var(--ink)); background: rgba(255,255,255,.07); }
    .link { color: rgb(var(--accent)); font-weight: 600; }
    .link:hover { text-decoration: underline; }

    .input { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--line-strong); color: rgb(var(--ink)); font: inherit; }
    textarea.input { height: auto; padding: 10px 12px; resize: vertical; }
    .input:focus { outline: none; border-color: rgb(var(--accent) / .7); box-shadow: 0 0 0 3px rgb(var(--accent) / .15); }
    .input::placeholder { color: rgb(var(--muted) / .75); }
    label.field { display: block; font-size: 12.5px; color: rgb(var(--muted)); margin-bottom: 6px; font-weight: 500; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: rgba(255,255,255,.06); color: rgb(var(--muted)); border: 1px solid var(--line); white-space: nowrap; }
    .chip-live { background: rgb(var(--live) / .12); color: rgb(var(--live)); border-color: rgb(var(--live) / .3); }
    .chip-accent { background: rgb(var(--accent) / .12); color: rgb(var(--accent)); border-color: rgb(var(--accent) / .3); }
    .chip-warn { background: rgba(255, 193, 69, .12); color: #FFC145; border-color: rgba(255, 193, 69, .3); }
    .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
    .seg button { height: 28px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: rgb(var(--muted)); }
    .seg button[aria-selected="true"] { background: rgba(255,255,255,.1); color: rgb(var(--ink)); }
    .dot-live { width: 8px; height: 8px; border-radius: 99px; background: rgb(var(--live)); box-shadow: 0 0 0 0 rgb(var(--live) / .6); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(var(--live) / .55); } 70% { box-shadow: 0 0 0 7px rgb(var(--live) / 0); } 100% { box-shadow: 0 0 0 0 rgb(var(--live) / 0); } }

    /* --------- danh sách cuộc họp --------- */
    .mrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 104px 84px 128px 32px; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
    .mrow:hover { background: rgba(255,255,255,.035); border-color: var(--line); }
    .mrow.is-live { background: rgb(var(--live) / .05); border-color: rgb(var(--live) / .18); }
    .mrow-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mrow-sub { color: rgb(var(--muted)); font-size: 12.5px; }
    @media (max-width: 860px) {
      .mrow { grid-template-columns: minmax(0, 1fr) 32px; }
      .mrow .mcol { display: none; }
      .mrow .mcol-mobile { display: block; }
    }

    /* --------- người nói --------- */
    .spk-row { position: relative; display: flex; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 12px; border: 1px solid transparent; }
    .spk-row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--spk); }
    .spk-row:hover { background: rgba(255,255,255,.03); border-color: var(--line); }
    .spk-row.is-speaking { background: color-mix(in srgb, var(--spk) 9%, transparent); border-color: color-mix(in srgb, var(--spk) 30%, transparent); }
    .avatar { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0b0f12; background: var(--spk); }
    .spk-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
    .spk-bar > span { display: block; height: 100%; background: var(--spk); border-radius: 4px; transition: width .4s; }
    .eq { display: none; gap: 2px; align-items: flex-end; height: 12px; }
    .is-speaking .eq { display: inline-flex; }
    .eq i { width: 3px; background: var(--spk); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

    /* --------- transcript --------- */
    .tgroup { position: relative; padding: 2px 0 2px 16px; margin-bottom: 14px; }
    .tgroup::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--spk); opacity: .85; }
    .tgroup-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .tname { font-weight: 600; color: var(--spk); }
    .tname:hover { text-decoration: underline; }
    .tline { position: relative; padding: 3px 34px 3px 0; border-radius: 8px; line-height: 1.6; }
    .tline:hover { background: rgba(255,255,255,.03); }
    .tline-act { position: absolute; right: 2px; top: 2px; opacity: 0; }
    .tline:hover .tline-act, .tline-act:focus-visible { opacity: 1; }
    .tline.flash { animation: flash 1.4s ease-out; }
    @keyframes flash { from { background: color-mix(in srgb, var(--spk) 22%, transparent); } to { background: transparent; } }
    .tinterim { padding: 2px 0 2px 16px; position: relative; color: rgb(var(--muted)); font-style: italic; }
    .tinterim::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--spk); opacity: .4; }

    /* --------- AI / markdown --------- */
    .md { line-height: 1.65; font-size: 14px; }
    .md h1 { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
    .md h2 { font-size: 16px; font-weight: 700; margin: 20px 0 8px; color: rgb(var(--accent)); }
    .md h3 { font-size: 14.5px; font-weight: 700; margin: 16px 0 6px; }
    .md p { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; margin: 6px 0; } .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--line-strong); padding: 6px 8px; text-align: left; vertical-align: top; }
    .md th { background: rgba(255,255,255,.05); font-weight: 600; }
    .md code { background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
    .md pre { background: rgba(0,0,0,.35); padding: 10px; border-radius: 10px; overflow-x: auto; }
    .turn-user { margin-left: auto; max-width: 88%; background: rgba(255,255,255,.06); border: 1px solid var(--line); padding: 8px 12px; border-radius: 14px 14px 4px 14px; }
    .turn-ai { max-width: 100%; }
    .step { color: rgb(var(--muted)); font-size: 12.5px; }
    .tab { height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: rgb(var(--muted)); display: inline-flex; align-items: center; gap: 6px; }
    .tab:hover { color: rgb(var(--ink)); }
    .tab[aria-selected="true"] { background: rgba(255,255,255,.08); color: rgb(var(--ink)); }
    .tab .count { font-size: 11px; color: rgb(var(--muted)); }

    /* --------- overlay --------- */
    .modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(4, 7, 9, .72); backdrop-filter: blur(6px); }
    .modal { width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; background: rgb(var(--raise)); border: 1px solid var(--line-strong); border-radius: 18px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .popover { position: fixed; z-index: 70; min-width: 220px; max-width: 300px; background: rgb(var(--raise)); border: 1px solid var(--line-strong); border-radius: 12px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    .menu-item { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
    .menu-item:hover { background: rgba(255,255,255,.07); }
    .menu-item.danger { color: rgb(var(--danger)); }
    .menu-label { padding: 6px 10px 4px; font-size: 12px; color: rgb(var(--muted)); }
    .toasts { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: min(460px, calc(100vw - 32px)); }
    .toast { background: rgb(var(--raise)); border: 1px solid var(--line-strong); border-left: 3px solid rgb(var(--accent)); padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); font-size: 13px; animation: toastIn .2s ease-out; }
    .toast.err { border-left-color: rgb(var(--danger)); }
    .toast.info { border-left-color: #5AB2FF; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
    .meter i { width: 3px; border-radius: 2px; background: rgba(255,255,255,.18); height: 4px; transition: height .08s, background .08s; }
    .spinner { width: 14px; height: 14px; border-radius: 99px; border: 2px solid rgba(255,255,255,.2); border-top-color: rgb(var(--accent)); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --------- phòng họp: bố cục --------- */
    .room-grid { display: grid; grid-template-columns: 248px minmax(0, 1fr) 336px; gap: 12px; min-height: 0; }
    @media (min-width: 1280px) { .room-grid { grid-template-columns: 288px minmax(0, 1fr) minmax(360px, 440px); } }
    @media (min-width: 1536px) { .room-grid { grid-template-columns: 300px minmax(0, 1fr) 520px; } }
    @media (max-width: 1023px) {
      .room-grid { grid-template-columns: minmax(0, 1fr); }
      .room-grid > [data-pane]:not(.pane-active) { display: none; }
    }
  </style>
</head>
<body class="flex flex-col-reverse sm:flex-row overflow-hidden">

  <!-- ===================== THANH ĐIỀU HƯỚNG ===================== -->
  <nav class="rail h-14 sm:h-full w-full sm:w-16 flex sm:flex-col items-center justify-around sm:justify-between px-4 sm:px-0 sm:py-4 shrink-0" aria-label="Điều hướng chính">
    <div class="flex sm:flex-col items-center gap-6 sm:gap-2">
      <a href="#/" class="hidden sm:grid mb-3 w-10 h-10 rounded-xl place-items-center" style="background: rgb(var(--accent) / .14); color: rgb(var(--accent));" aria-label="Meeting Copilot - trang chủ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </a>
      <a href="#/" class="rail-btn" data-nav="hub" title="Cuộc họp" aria-label="Cuộc họp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </a>
      <button class="rail-btn" data-act="nav-room" data-nav="room" title="Phòng họp đang mở" aria-label="Phòng họp đang mở" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      </button>
      <a href="#/voices" class="rail-btn" data-nav="voices" title="Hồ sơ giọng nói" aria-label="Hồ sơ giọng nói">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 6a4 4 0 0 1 0 6M20 3a8 8 0 0 1 0 12"/></svg>
      </a>
    </div>
    <button class="rail-btn" data-act="diag" title="Tình trạng hệ thống" aria-label="Tình trạng hệ thống">
      <span id="health-dot" class="w-2.5 h-2.5 rounded-full" style="background: rgb(var(--muted));"></span>
    </button>
  </nav>

  <!-- ===================== NỘI DUNG ===================== -->
  <div class="flex-1 min-w-0 min-h-0 sm:h-full flex flex-col">
    <header class="h-16 shrink-0 flex items-center justify-between gap-3 px-3 sm:px-4 md:px-6 border-b divider">
      <div id="topbar-left" class="min-w-0 flex items-center gap-3"></div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="rec-pill" class="hidden btn btn-ghost btn-sm" data-act="go-recording" title="Về phòng đang ghi âm">
          <span class="dot-live"></span><span id="rec-pill-text" class="max-w-[180px] truncate">Đang ghi</span>
          <span class="meter" id="rec-meter"><i></i><i></i><i></i><i></i></span>
        </button>
        <button class="btn btn-primary" data-act="create-meeting" aria-label="Tạo cuộc họp" title="Tạo cuộc họp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hidden sm:inline">Tạo cuộc họp</span>
        </button>
      </div>
    </header>

    <main class="flex-1 min-h-0 overflow-hidden">
      <!-- ============ VIEW: DANH SÁCH CUỘC HỌP ============ -->
      <section id="view-hub" class="h-full overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 md:px-6 py-6">
          <p id="hub-summary" class="text-muted mb-5"></p>
          <div id="hub-live"></div>
          <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
            <div class="seg" role="tablist" aria-label="Lọc cuộc họp">
              <button role="tab" data-act="hub-filter" data-filter="all" aria-selected="true">Tất cả</button>
              <button role="tab" data-act="hub-filter" data-filter="live" aria-selected="false">Đang diễn ra</button>
              <button role="tab" data-act="hub-filter" data-filter="ended" aria-selected="false">Đã kết thúc</button>
            </div>
            <input id="hub-search" class="input max-w-xs" type="search" placeholder="Tìm theo tên cuộc họp" aria-label="Tìm cuộc họp">
          </div>
          <div class="mrow text-[12px] text-muted cursor-default" style="padding-top:4px;padding-bottom:4px" aria-hidden="true">
            <span>Cuộc họp</span><span class="mcol">Thời lượng</span><span class="mcol">Người nói</span><span class="mcol">Số câu</span><span class="mcol">Trạng thái</span><span></span>
          </div>
          <ul id="hub-list" class="flex flex-col gap-1"></ul>
        </div>
      </section>

      <!-- ============ VIEW: PHÒNG HỌP ============ -->
      <section id="view-room" class="h-full hidden flex-col p-3 md:p-4 gap-3">
        <div class="lg:hidden seg self-start" role="tablist" aria-label="Chọn khu vực">
          <button role="tab" data-act="room-pane" data-pane="people" aria-selected="false">Người nói</button>
          <button role="tab" data-act="room-pane" data-pane="transcript" aria-selected="true">Transcript</button>
          <button role="tab" data-act="room-pane" data-pane="ai" aria-selected="false">Jarvis</button>
        </div>
        <div class="room-grid flex-1 min-h-0">
          <!-- Cột trái: mic + người nói -->
          <aside class="panel flex flex-col min-h-0" data-pane="people">
            <div class="p-4 border-b divider" id="mic-box"></div>
            <div class="flex-1 min-h-0 overflow-y-auto p-3">
              <div class="flex items-center justify-between px-1 mb-2">
                <h2 class="font-semibold">Người nói <span id="spk-count" class="text-muted font-normal num"></span></h2>
                <button id="btn-infer" class="btn btn-ghost btn-sm hidden" data-act="infer-names" title="AI đọc hội thoại để đoán tên những người chưa định danh">AI đoán tên</button>
              </div>
              <ul id="spk-list" class="flex flex-col gap-1"></ul>
              <div id="sugg-list" class="mt-3 flex flex-col gap-2"></div>
            </div>
          </aside>

          <!-- Cột giữa: transcript -->
          <section class="panel flex flex-col min-h-0 pane-active" data-pane="transcript">
            <div class="h-12 px-4 border-b divider flex items-center justify-between gap-2 shrink-0">
              <h2 class="font-semibold">Transcript</h2>
              <span id="t-status" class="text-[12.5px] text-muted truncate"></span>
            </div>
            <div class="relative flex-1 min-h-0">

<script>
'use strict';
/* =====================================================================
   TIỆN ÍCH
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const PALETTE = ['#5AB2FF', '#FF7AC6', '#FFC145', '#B79CFF', '#3FD7E6', '#FF9A55', '#9BE15D', '#FF8A8A'];
const NEUTRAL = '#8D99A5';
const MEETING_TYPES = ['Technical Review', 'Sprint Planning', 'Daily Standup', 'Brainstorming', 'Họp khách hàng', 'Phỏng vấn'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
const fmt = {
  clock(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  },
  dur(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return `${sec} giây`;
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return h ? `${h} giờ ${m} phút` : `${m} phút`;
  },
  date(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  },
};
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  if (/^Người nói \d+$/.test(name)) return parts[2];
  return (parts[parts.length - 1] || '?').charAt(0).toUpperCase();
}
function colorOf(sid) { return sid ? PALETTE[(sid - 1) % PALETTE.length] : NEUTRAL; }

async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body instanceof FormData) opt.body = body;
  else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(url, opt); }
  catch (e) { throw new Error('Không kết nối được máy chủ. Kiểm tra server đang chạy.'); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* không phải JSON */ }
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : (Array.isArray(d) ? d.map(x => x.msg).join('; ') : `Lỗi ${res.status}`));
  }
  return data;
}
const GET = u => api('GET', u), POST = (u, b) => api('POST', u, b ?? {}), DEL = u => api('DELETE', u);
const PATCH = (u, b) => api('PATCH', u, b), PUT = (u, b) => api('PUT', u, b);

function toast(msg, kind = 'ok', ms = 3800) {
  const el = document.createElement('div');
  el.className = `toast ${kind === 'ok' ? '' : kind}`;
  el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? ms + 2500 : ms);
}

/* ---------- Modal & menu ---------- */
let modalCloser = null;
function openModal(html, { onMount, wide } = {}) {
  closeModal();
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-wrap" data-modal-bg><div class="modal" role="dialog" aria-modal="true" style="${wide ? 'max-width:560px' : ''}">${html}</div></div>`;
  const modal = $('.modal', root);
  const first = $('input:not([type=hidden]):not([type=checkbox]), textarea, select', modal) || $('button', modal);
  setTimeout(() => first && first.focus(), 30);
  if (onMount) onMount(modal);
  return modal;
}
function closeModal() {
  if (modalCloser) { const f = modalCloser; modalCloser = null; f(); }
  $('#modal-root').innerHTML = '';
}
function confirmDialog({ title, body, ok = 'Đồng ý', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    openModal(`
      <h3 class="text-lg font-semibold mb-2">${esc(title)}</h3>
      <p class="text-muted mb-5">${esc(body)}</p>
      <div class="flex justify-end gap-2">
        <button class="btn btn-ghost" data-confirm="0">Hủy</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm="1">${esc(ok)}</button>
      </div>`, {
      onMount(m) {
        m.addEventListener('click', e => {
          const b = e.target.closest('[data-confirm]');
          if (b) { finish(b.dataset.confirm === '1'); closeModal(); }
        });
      }
    });
    modalCloser = () => finish(false);
  });
}
function openMenu(anchor, items) {
  closeMenu();
  const pop = $('#popover');
  pop.innerHTML = items.map(it => it.label
    ? `<div class="menu-label">${esc(it.label)}</div>`
    : `<button class="menu-item ${it.danger ? 'danger' : ''}" data-menu="${esc(it.id)}" ${it.disabled ? 'disabled style="opacity:.45"' : ''}>${it.swatch ? `<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${it.swatch}"></span>` : ''}<span class="truncate">${esc(it.text)}</span></button>`).join('');
  pop.classList.remove('hidden');
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.right - w, window.innerWidth - w - 8); left = Math.max(8, left);
  let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  return new Promise(resolve => {
    pop._resolve = resolve;
    pop.onclick = e => {
      const b = e.target.closest('[data-menu]');
      if (b && !b.disabled) { pop._resolve = null; closeMenu(); resolve(b.dataset.menu); }
    };
    const first = $('[data-menu]', pop); first && first.focus();
  });
}
function closeMenu() {
  const pop = $('#popover');
  if (!pop.classList.contains('hidden')) {
    pop.classList.add('hidden');
    if (pop._resolve) { const r = pop._resolve; pop._resolve = null; r(null); }
  }
}

/* =====================================================================
   TRẠNG THÁI
   ===================================================================== */
const S = {
  view: 'hub', meetings: [], stats: null, filter: 'all', q: '',
  voices: [], directory: [], health: null,
  room: null,
};

/* =====================================================================
   ĐIỀU HƯỚNG (hash router: #/, #/m/12, #/voices)

function showView(name) {
  S.view = name;
  $('#view-hub').classList.toggle('hidden', name !== 'hub');

}
async function route() {
  closeMenu();
  const h = location.hash || '#/';
  const m = h.match(/^#\/m\/(\d+)/);
  if (m) return openRoom(parseInt(m[1], 10));
  if (h.startsWith('#/voices')) { showView('voices'); return loadVoices(); }
  showView('hub');

}
window.addEventListener('hashchange', route);

function renderTopbar() {
  const left = $('#topbar-left');
  renderRecPill();
  if (S.view === 'room' && S.room && !S.room.meeting) {
    left.innerHTML = '<div class="flex items-center gap-2 text-muted"><span class="spinner"></span>Đang mở phòng họp...</div>';
  } else if (S.view === 'room' && S.room) {
    const m = S.room.meeting;
    const live = m.status !== 'ended';
    left.innerHTML = `
      <a href="#/" class="icon-btn shrink-0" aria-label="Về danh sách cuộc họp" title="Về danh sách cuộc họp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="min-w-0">
        <h1 class="font-semibold text-[16px] truncate">${esc(m.title)}</h1>
        <div class="flex items-center gap-2 text-[12.5px] text-muted min-w-0">
          <span class="chip hidden md:inline-flex">${esc(m.meeting_type || 'Cuộc họp')}</span>
          ${live ? `<span class="chip chip-live"><span class="dot-live" style="width:6px;height:6px"></span>Đang diễn ra <span class="num" data-since="${m.started_at}">${fmt.clock(Date.now() / 1000 - m.started_at)}</span></span>`
                 : `<span class="truncate">Đã kết thúc ${esc(fmt.date(m.ended_at))}<span class="hidden sm:inline">, dài ${esc(fmt.dur((m.ended_at || 0) - (m.started_at || 0)))}</span></span>`}
        </div>
      </div>
      ${live ? `<button class="btn btn-ghost btn-sm shrink-0 ml-1" data-act="end-meeting"><span class="sm:hidden">Kết thúc</span><span class="hidden sm:inline">Kết thúc cuộc họp</span></button>` : ''}
      <button class="icon-btn shrink-0" data-act="room-menu" aria-label="Tùy chọn cuộc họp" title="Tùy chọn cuộc họp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>`;
  } else {
    const title = S.view === 'voices' ? 'Hồ sơ giọng nói' : 'Cuộc họp';
    left.innerHTML = `<h1 class="text-[20px] font-semibold tracking-tight">${title}</h1>`;
  }
  const roomBtn = $('[data-nav="room"]');
  const target = S.room ? S.room.id : MIC.mid;
  roomBtn.disabled = !target;
  roomBtn.title = target ? 'Về phòng họp đang mở' : 'Chưa mở phòng họp nào';
}

/* =====================================================================
   DANH SÁCH CUỘC HỌP
   ===================================================================== */
async function loadHub() {
  try {
    const [m, st] = await Promise.all([GET('/api/meetings'), GET('/api/stats')]);
    S.meetings = m.meetings || []; S.stats = st;
  } catch (e) { toast(e.message, 'err'); }
  renderHub();
}
function renderHub() {
  const st = S.stats;
  if (st) {
    const parts = [`${st.meetings_total} cuộc họp`];
    if (st.total_duration_s) parts.push(`tổng ${fmt.dur(st.total_duration_s)} đã ghi`);
    parts.push(`${st.voices_total} hồ sơ giọng nói`);
    $('#hub-summary').textContent = parts.join(', ') + '.';
  }
  const live = S.meetings.filter(m => m.status === 'live');
  $('#hub-live').innerHTML = live.length && S.filter === 'all' ? `
    <h2 class="font-semibold mb-2">Đang diễn ra</h2>
    <ul class="flex flex-col gap-1 mb-6">${live.map(rowHtml).join('')}</ul>` : '';
  const q = S.q.trim().toLowerCase();
  let rows = S.meetings.filter(m => S.filter === 'all' || m.status === S.filter);
  if (S.filter === 'all') rows = rows.filter(m => m.status !== 'live');
  if (q) rows = rows.filter(m => (m.title || '').toLowerCase().includes(q) || (m.meeting_type || '').toLowerCase().includes(q));
  const list = $('#hub-list');
  if (!rows.length) {
    const msg = S.meetings.length === 0
      ? 'Chưa có cuộc họp nào. Bấm "Tạo cuộc họp" ở góc trên bên phải để bắt đầu.'
      : (q ? `Không có cuộc họp nào khớp "${S.q}".` : (S.filter === 'all' ? 'Không có cuộc họp đã kết thúc.' : 'Không có cuộc họp nào trong mục này.'));
    list.innerHTML = `<li class="text-muted py-10 text-center">${esc(msg)}</li>`;
  } else list.innerHTML = rows.map(rowHtml).join('');
}
function rowHtml(m) {
  const isLive = m.status === 'live';
  const recording = MIC.on && MIC.mid === m.id;
  const status = isLive
    ? `<span class="chip chip-live">${recording ? '<span class="dot-live" style="width:6px;height:6px"></span>Đang ghi' : 'Đang diễn ra'}</span>`
    : `<span class="chip">Đã kết thúc</span>`;
  return `<li class="mrow ${isLive ? 'is-live' : ''}" data-act="open-meeting" data-mid="${m.id}" tabindex="0">
    <div class="min-w-0">
      <div class="mrow-title">${esc(m.title)}</div>
      <div class="mrow-sub">${esc(m.meeting_type || '')}${m.meeting_type ? ', ' : ''}${esc(fmt.date(m.started_at))}
        <span class="mcol-mobile hidden">${esc(fmt.dur(m.duration_s))}, ${m.speaker_count || 0} người nói</span></div>
    </div>
    <span class="mcol num text-muted">${isLive ? `<span data-since="${m.started_at}">${fmt.clock(Date.now() / 1000 - m.started_at)}</span>` : esc(fmt.dur(m.duration_s))}</span>
    <span class="mcol num text-muted">${m.speaker_count || 0}</span>
    <span class="mcol num text-muted">${m.segment_count || 0}</span>
    <span class="mcol">${status}</span>
    <button class="icon-btn" data-act="meeting-menu" data-mid="${m.id}" aria-label="Tùy chọn cuộc họp ${esc(m.title)}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </li>`;
}
$('#hub-search').addEventListener('input', e => { S.q = e.target.value; renderHub(); });

function newRoom(id) {
  return {
    id, meeting: null, segs: new Map(), order: [], speakers: new Map(), suggestions: new Map(),
    artifacts: [], tab: 'jarvis', artSel: {}, turns: [], interim: null, activeSid: null, activeAt: 0,
    ws: null, wsRetry: 0, wsTimer: null, pingTimer: null, pollTimer: null, closed: false, newBelow: false,
    vp: 'desktop',
  };
}
async function openRoom(mid) {
  if (S.room && S.room.id === mid && S.room.meeting) { showView('room'); return; }
  closeRoom();
  const R = S.room = newRoom(mid);
  showView('room');
  renderRoomSkeleton();
  try {
    const d = await GET(`/api/meetings/${mid}`);
    if (S.room !== R) return;
    applySnapshot(d);
  } catch (e) {
    toast(e.message, 'err');
    location.hash = '#/';
    return;
  }
  renderRoom();
  if (R.meeting.status !== 'ended' || R.meeting.minutes_status === 'pending') connectEvents(R);
}
function closeRoom() {
  const R = S.room;
  if (!R) return;
  R.closed = true;
  clearTimeout(R.wsTimer); clearInterval(R.pingTimer); clearInterval(R.pollTimer);
  if (R.ws) { try { R.ws.close(); } catch (e) { /* bỏ qua */ } }
  S.room = null;
}
function applySnapshot(d) {
  const R = S.room;
  R.meeting = d.meeting;
  R.segs.clear(); R.order = [];
  (d.segments || []).forEach(s => { R.segs.set(s.seq, s); R.order.push(s.seq); });
  R.speakers = new Map((d.speakers || []).map(p => [p.sid, p]));
  R.spkSig = (d.speakers || []).map(p => `${p.sid}:${p.label}:${p.origin}`).join('|');
  R.suggestions = new Map((d.suggestions || []).map(s => [s.inference_id, s]));
  R.artifacts = (d.artifacts || []).slice().sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
}

  $('#pane-jarvis').innerHTML = ''; $('#t-interim').classList.add('hidden'); $('#t-empty').classList.add('hidden');

/* ---------- WebSocket sự kiện ---------- */
function wsUrl(path) { return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${path}`; }
function connectEvents(R) {
  if (R.closed) return;
  const ws = new WebSocket(wsUrl(`/ws/meeting/${R.id}/events`));
  R.ws = ws;
  ws.onopen = () => {
    R.wsRetry = 0;
    clearInterval(R.pingTimer);
    R.pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('{"type":"ping"}'); }, 25000);
    setStatus('');
  };
  ws.onmessage = e => { try { onEvent(R, JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    clearInterval(R.pingTimer);
    if (R.closed || S.room !== R) return;
    if (R.meeting && R.meeting.status === 'ended' && R.meeting.minutes_status !== 'pending') return;
    R.wsRetry += 1;
    setStatus('Mất kết nối máy chủ, đang kết nối lại...');
    R.wsTimer = setTimeout(() => connectEvents(R), Math.min(8000, 800 * R.wsRetry));
  };
}
function setStatus(text) { $('#t-status').textContent = text || ''; }

function onEvent(R, ev) {
  if (S.room !== R) return;
  switch (ev.type) {
    case 'init':
      applySnapshot(ev); renderRoom(); break;
    case 'segment': addSegment(ev.segment); break;
    case 'segments_relabeled':
      ev.items.forEach(it => { const s = R.segs.get(it.seq); if (s) Object.assign(s, it); });
      scheduleTranscript(); break;
    case 'speakers': {
      R.speakers = new Map(ev.speakers.map(p => [p.sid, p]));
      renderSpeakers(); renderSuggestions();
      const sig = ev.speakers.map(p => `${p.sid}:${p.label}:${p.origin}`).join('|');
      if (sig !== R.spkSig) { R.spkSig = sig; scheduleTranscript(); }   // chỉ vẽ lại khi tên/nguồn đổi
      break;
    }
    case 'speakers_merged': {
      if (!ev.auto) break;   // gộp thủ công đã có thông báo riêng
      const t = R.speakers.get(ev.target_sid);
      toast(`Hai người nói có giọng trùng khớp nên đã được gộp${t ? ` vào ${t.label}` : ''}. Có thể tách lại từng câu nếu sai.`, 'info', 6000); break;
    }
    case 'speaker_renamed':
      if (ev.origin === 'ai') toast(`AI nhận ra ${ev.old_label} là ${ev.new_name} (${Math.round((ev.confidence || 0) * 100)}%). Bấm vào tên để sửa nếu sai.`, 'info', 6000);
      break;
    case 'interim': setInterim(ev); break;
    case 'identity_suggestion':
      R.suggestions.set(ev.inference_id, ev); renderSuggestions();
      toast(`AI gợi ý: ${ev.label} có thể là ${ev.suggested_name}.`, 'info'); break;
    case 'suggestion_resolved': R.suggestions.delete(ev.inference_id); renderSuggestions(); break;
    case 'stream_status': onStreamStatus(ev); break;
    case 'ai_activated': {
      const t = newTurn(ev.prompt, 'voice'); t.pendingVoice = true; switchTab('jarvis'); renderJarvis(); break;
    }
    case 'ai_thinking': currentTurn().steps.push(ev.text); renderJarvis(); break;
    case 'ai_tool_call': currentTurn().tools.push(ev.tool); renderJarvis(); break;
    case 'ai_response': finishTurn(currentTurn(), ev.response); break;
    case 'ai_error': { const t = currentTurn(); t.error = ev.text; t.done = true; renderJarvis(); break; }
    case 'artifact_created':
    case 'artifact_updated':
      addArtifact(ev.artifact, true);
      // Co-design gửi từ chính trình duyệt này: lời đáp đã hiện qua phản hồi HTTP
      if (ev.artifact && ev.artifact.chat_message && !R.pendingCoDesign) appendAssistantNote(ev.artifact.chat_message, ev.artifact);
      break;
    case 'meeting_status':
      R.meeting = Object.assign(R.meeting, ev.meeting || {}, { status: ev.status, minutes_status: ev.minutes_status });
      if (ev.status === 'ended' && MIC.on && MIC.mid === R.id) stopMic(true);
      renderTopbar(); renderMicBox(); renderTabs();
      if (ev.minutes_status === 'failed') toast('Không lập được biên bản tự động. Thử nhờ Jarvis lập lại.', 'err');
      break;
    case 'error': toast(ev.text, 'err'); break;
  }
}

/* ---------- Transcript ---------- */
function speakerOf(sid) { return S.room && S.room.speakers.get(sid); }
function labelOfSeg(s) { const p = speakerOf(s.speaker_key); return p ? p.label : (s.speaker_label || 'Không rõ'); }
function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 90; }

function groupOpen(s) {
  const p = speakerOf(s.speaker_key);
  const label = p ? p.label : (s.speaker_label || 'Không rõ');
  const badge = p && p.origin === 'ai' ? '<span class="chip chip-warn" title="Tên do AI suy luận từ hội thoại">AI đoán</span>'
    : (p && !p.name ? '<span class="chip">chưa định danh</span>' : '');
  return `<div class="tgroup" data-sid="${s.speaker_key ?? ''}" style="--spk:${colorOf(s.speaker_key)}">

      <button class="tname" data-act="rename" data-sid="${s.speaker_key ?? ''}" title="Đặt tên / đổi tên người nói">${esc(label)}</button>

    </div>`;
}
function lineHtml(s) {
  return `<div class="tline" data-seq="${s.seq}"><span>${esc(s.text)}</span>
    <button class="icon-btn tline-act" data-act="line-menu" data-seq="${s.seq}" aria-label="Đổi người nói của câu này" title="Đổi người nói của câu này">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button></div>`;
}
function renderTranscript(forceBottom = false) {
  const R = S.room; if (!R || !R.meeting) return;
  const box = $('#t-scroll');
  const keep = !forceBottom && !nearBottom(box) ? box.scrollTop : null;
  const out = []; let cur;
  for (const seq of R.order) {
    const s = R.segs.get(seq);
    if (cur === undefined || cur !== s.speaker_key) {
      if (cur !== undefined) out.push('</div>');
      out.push(groupOpen(s)); cur = s.speaker_key;
    }
    out.push(lineHtml(s));
  }
  if (cur !== undefined) out.push('</div>');
  $('#t-list').innerHTML = out.join('');
  const empty = $('#t-empty');
  if (!R.order.length) {
    empty.innerHTML = R.meeting.status === 'ended'
      ? '<p>Cuộc họp này không có nội dung ghi âm.</p>'
      : '<div class="max-w-sm"><p class="text-ink font-medium mb-1">Chưa có nội dung</p><p>Bấm "Bật mic" ở cột trái để bắt đầu. Mỗi người nói được tách riêng, tô một màu và hiện ở danh sách người nói.</p></div>';
    empty.classList.remove('hidden');
  } else empty.classList.add('hidden');
  if (keep !== null) box.scrollTop = keep; else box.scrollTop = box.scrollHeight;
}
let tTimer = null;
function scheduleTranscript() { clearTimeout(tTimer); tTimer = setTimeout(() => renderTranscript(false), 60); }
function addSegment(s) {
  const R = S.room;
  if (R.segs.has(s.seq)) { Object.assign(R.segs.get(s.seq), s); scheduleTranscript(); return; }
  R.segs.set(s.seq, s); R.order.push(s.seq);
  const box = $('#t-scroll'); const stick = nearBottom(box);
  const list = $('#t-list');
  const last = list.lastElementChild;
  $('#t-empty').classList.add('hidden');
  if (last && last.classList.contains('tgroup') && last.dataset.sid === String(s.speaker_key ?? '')) {
    last.insertAdjacentHTML('beforeend', lineHtml(s));
  } else {
    list.insertAdjacentHTML('beforeend', groupOpen(s) + lineHtml(s) + '</div>');
  }
  const el = $(`.tline[data-seq="${s.seq}"]`, list);
  if (el) el.classList.add('flash');
  markSpeaking(s.speaker_key);
  if (stick) box.scrollTop = box.scrollHeight; else { R.newBelow = true; $('#t-jump').classList.remove('hidden'); }
}
function setInterim(ev) {
  const el = $('#t-interim');
  if (!ev.text) { el.classList.add('hidden'); return; }
  const box = $('#t-scroll'); const stick = nearBottom(box);
  el.style.setProperty('--spk', colorOf(ev.speaker_key));
  el.innerHTML = `<span class="not-italic font-medium" style="color:${colorOf(ev.speaker_key)}">${esc(ev.speaker_label || 'Đang nghe')}</span>: ${esc(ev.text)}`;
  el.classList.remove('hidden');
  if (ev.speaker_key) markSpeaking(ev.speaker_key);
  if (stick) box.scrollTop = box.scrollHeight;
}
$('#t-scroll').addEventListener('scroll', e => {
  if (nearBottom(e.target)) { $('#t-jump').classList.add('hidden'); if (S.room) S.room.newBelow = false; }
});

    if (!ok) return;
    try {
      await POST(`/api/meetings/${R.id}/speakers/${sid}/merge`, { target_sid: target.sid });
      toast(`Đã gộp vào ${target.label}.`);

    } catch (e) { toast(e.message, 'err'); }
  }
}
async function lineMenu(btn, seq) {

async function endMeeting() {
  const R = S.room;
  const ok = await confirmDialog({ title: 'Kết thúc cuộc họp?', body: 'Mic sẽ tắt và AI tự lập biên bản. Sau khi kết thúc vẫn sửa được tên người nói và xem lại transcript.', ok: 'Kết thúc cuộc họp' });
  if (!ok) return;
  if (MIC.on && MIC.mid === R.id) stopMic(true);
  try {
    const r = await POST(`/api/meetings/${R.id}/archive`);
    R.meeting.status = 'ended'; R.meeting.ended_at = Date.now() / 1000; R.meeting.minutes_status = r.minutes_status;
    toast(r.minutes_status === 'pending' ? 'Đã kết thúc. Biên bản đang được lập, sẽ hiện ở thẻ Biên bản.' : 'Đã kết thúc cuộc họp.');
    renderTopbar(); renderMicBox(); renderTabs();
    if (r.minutes_status === 'pending') { switchTab('minutes'); watchMinutes(R); }
  } catch (e) { toast(e.message, 'err'); }

function watchMinutes(R) {
  clearInterval(R.pollTimer);
  R.pollTimer = setInterval(async () => {
    if (S.room !== R) return clearInterval(R.pollTimer);
    if (R.ws && R.ws.readyState === 1) return;
    try {
      const d = await GET(`/api/meetings/${R.id}`);
      if (d.meeting.minutes_status !== 'pending') { clearInterval(R.pollTimer); applySnapshot(d); renderRoom(); }
    } catch (e) { /* thử lại lần sau */ }
  }, 4000);
}
async function deleteMeeting(mid) {
  const m = S.meetings.find(x => x.id === mid) || (S.room && S.room.id === mid ? S.room.meeting : null);

  try {
    if (MIC.on && MIC.mid === mid) stopMic(true);

async function exportMarkdown(mid) {
  try {
    const d = (S.room && S.room.id === mid) ? null : await GET(`/api/meetings/${mid}`);
    const m = d ? d.meeting : S.room.meeting;
    const speakers = d ? d.speakers : [...S.room.speakers.values()];
    const segs = d ? d.segments : S.room.order.map(q => S.room.segs.get(q));
    const arts = d ? d.artifacts : S.room.artifacts;
    const names = new Map(speakers.map(p => [p.sid, p.label]));
    let md = `# ${m.title}\n\n- Thời gian: ${fmt.date(m.started_at)}${m.ended_at ? ` - ${fmt.date(m.ended_at)}` : ''}\n- Loại: ${m.meeting_type || ''}\n`;
    if (speakers.length) md += `- Người nói: ${speakers.map(p => p.label + (p.role ? ` (${p.role})` : '')).join(', ')}\n`;
    if ((m.agenda || []).length) md += `\n## Chương trình\n${m.agenda.map(a => `- ${a}`).join('\n')}\n`;
    const minutes = [...arts].reverse().find(a => a.kind === 'minutes');
    if (minutes) md += `\n## Biên bản (AI)\n\n${minutes.content}\n`;
    md += `\n## Transcript\n\n`;
    segs.forEach(s => { md += `**${names.get(s.speaker_key) || s.speaker_label}** [${fmt.clock(s.t_start)}]: ${s.text}\n\n`; });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
    a.download = `cuoc-hop-${mid}.md`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Đã xuất file Markdown.');
  } catch (e) { toast(e.message, 'err'); }
}

/* =====================================================================
   MIC: thu âm, chuyển về PCM16 16kHz, gửi qua WebSocket
   ===================================================================== */
const MIC = { on: false, mid: null, ws: null, cap: null, state: 'off', msg: '', level: 0, retries: 0, buffer: [], gen: 0 };
const WORKLET_SRC = `class Cap extends AudioWorkletProcessor { process(inputs) { const c = inputs[0] && inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } } registerProcessor('pcm-capture', Cap);`;

/** Hạ tần số mẫu về 16kHz PCM16 theo từng khối, lọc trung bình theo cửa sổ để chống răng cưa. */
function makeResampler(inRate, outRate = 16000) {
  const ratio = inRate / outRate;
  let carry = new Float32Array(0), pos = 0;
  return function push(chunk) {
    const buf = new Float32Array(carry.length + chunk.length); buf.set(carry); buf.set(chunk, carry.length);
    const n = ratio >= 1 ? Math.floor((buf.length - pos) / ratio) : Math.max(0, Math.floor((buf.length - 1 - pos) / ratio));
    if (n <= 0) { carry = buf; return new Int16Array(0); }
    const res = new Int16Array(n);
    let p = pos;
    for (let i = 0; i < n; i++) {
      let v;
      if (ratio >= 1) {
        const a = Math.floor(p), b = Math.max(a + 1, Math.floor(p + ratio));
        let acc = 0; for (let j = a; j < b; j++) acc += buf[j];
        v = acc / (b - a);
      } else {
        const a = Math.floor(p), f = p - a; v = buf[a] * (1 - f) + buf[a + 1] * f;
      }
      v = Math.max(-1, Math.min(1, v));
      res[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
      p += ratio;
    }
    const used = Math.floor(p); carry = buf.slice(used); pos = p - used;
    return res;
  };
}

async function createCapture(onPcm, onLevel) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const resample = makeResampler(ctx.sampleRate);
  let out = [], outLen = 0;
  function handle(chunk) {
    let sum = 0; for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
    onLevel(Math.sqrt(sum / Math.max(1, chunk.length)));
    const res = resample(chunk);
    if (!res.length) return;
    out.push(res); outLen += res.length;
    if (outLen >= 1600) {                   // gửi theo khối ~100ms
      const merged = new Int16Array(outLen); let o = 0; out.forEach(x => { merged.set(x, o); o += x.length; });
      out = []; outLen = 0; onPcm(merged);
    }
  }
  let node;
  if (ctx.audioWorklet && window.AudioWorkletNode) {
    const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'pcm-capture');
    node.port.onmessage = e => handle(e.data);
  } else {
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = e => handle(new Float32Array(e.inputBuffer.getChannelData(0)));
  }
  src.connect(node); node.connect(ctx.destination);
  if (ctx.state === 'suspended') await ctx.resume();
  return {
    stop() {
      try { src.disconnect(); node.disconnect(); } catch (e) { /* bỏ qua */ }
      stream.getTracks().forEach(t => t.stop());
      ctx.close();
    }
  };
}
function setMic(state, msg = '') { MIC.state = state; MIC.msg = msg; renderMicBox(); renderRecPill(); }
async function startMic(mid) {
  if (MIC.on) {
    if (MIC.mid === mid) return;
    const ok = await confirmDialog({ title: 'Đang ghi âm cuộc họp khác', body: 'Dừng ghi cuộc họp kia để bật mic cho cuộc họp này?', ok: 'Chuyển mic sang đây' });
    if (!ok) return;
    stopMic(true);
  }
  const gen = ++MIC.gen;
  MIC.on = true; MIC.mid = mid; MIC.retries = 0; MIC.buffer = [];
  setMic('connecting', 'Đang xin quyền micro... (chọn "Cho phép" trên trình duyệt)');
  let cap;
  try {
    cap = await createCapture(pcm => sendPcm(pcm), rms => { MIC.level = rms; paintMeters(); });
  } catch (e) {
    if (gen !== MIC.gen) return;
    MIC.on = false; MIC.mid = null;
    const msg = e && e.name === 'NotAllowedError' ? 'Trình duyệt chưa cho phép dùng micro. Bấm biểu tượng ổ khóa trên thanh địa chỉ để cấp quyền.'
      : (e && e.name === 'NotFoundError' ? 'Không tìm thấy micro nào. Hãy cắm micro hoặc tai nghe rồi thử lại.' : `Không mở được micro: ${e.message || e}`);
    setMic('error', msg);
    return;
  }
  if (gen !== MIC.gen || !MIC.on) { cap.stop(); return; }   // người dùng đã bấm tắt trong lúc chờ cấp quyền
  MIC.cap = cap;
  openAudioSocket(mid);
}
function openAudioSocket(mid) {
  setMic('connecting', 'Đang kết nối dịch vụ nhận dạng giọng nói...');
  const ws = new WebSocket(wsUrl(`/ws/meeting/${mid}/audio`));
  ws.binaryType = 'arraybuffer';
  MIC.ws = ws;
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === 'ready') {
      MIC.retries = 0; setMic('live', 'Đang nghe');
      MIC.buffer.forEach(b => ws.send(b)); MIC.buffer = [];
    } else if (m.type === 'error') {
      ws._fatal = [4003, 4004, 4009, 4500].includes(m.code) ? m.text : null;
      toast(m.text, 'err', 7000);
    }
  };
  ws.onclose = () => {
    if (MIC.ws !== ws || !MIC.on) return;
    if (ws._fatal) { stopMic(true); setMic('error', ws._fatal); return; }
    MIC.retries += 1;
    if (MIC.retries > 5) { stopMic(true); setMic('error', 'Mất kết nối tới máy chủ. Kiểm tra mạng rồi bật lại mic.'); return; }
    setMic('reconnecting', 'Mất kết nối, đang thử lại...');
    setTimeout(() => { if (MIC.on && MIC.mid === mid) openAudioSocket(mid); }, Math.min(6000, 700 * MIC.retries));
  };
}
function sendPcm(pcm) {
  const ws = MIC.ws;
  if (ws && ws.readyState === 1 && MIC.state === 'live') ws.send(pcm.buffer);
  else if (MIC.on) { MIC.buffer.push(pcm.buffer); if (MIC.buffer.length > 60) MIC.buffer.shift(); }  // giữ tối đa ~6s khi đang kết nối
}
function stopMic(silent = false) {
  const ws = MIC.ws;
  MIC.gen += 1;
  MIC.on = false; MIC.ws = null; MIC.buffer = [];
  if (MIC.cap) { MIC.cap.stop(); MIC.cap = null; }
  if (ws) { try { if (ws.readyState === 1) ws.send('stop'); ws.close(); } catch (e) { /* bỏ qua */ } }
  MIC.mid = null; MIC.level = 0;
  setMic('off', '');
  if (!silent) toast('Đã tắt mic.');
}
function onStreamStatus(ev) {
  if (!MIC.on || !S.room || MIC.mid !== S.room.id) return;
  const map = { live: ['live', 'Đang nghe'], reconnecting: ['reconnecting', 'Dịch vụ nhận dạng mất kết nối, đang nối lại (không mất chữ)...'],
                connecting: ['connecting', 'Đang kết nối dịch vụ nhận dạng giọng nói...'], error: ['error', ev.message || 'Lỗi dịch vụ nhận dạng'] };
  const v = map[ev.state]; if (v) setMic(v[0], v[1]);
}
function paintMeters() {
  const lvl = Math.max(0, Math.min(1, (20 * Math.log10(MIC.level + 1e-6) + 55) / 45));
  $$('.meter').forEach(mt => $$('i', mt).forEach((bar, i, all) => {
    const on = lvl * all.length > i;
    bar.style.height = on ? `${5 + (i + 1) * (9 / all.length)}px` : '4px';
    bar.style.background = on ? 'rgb(var(--live))' : 'rgba(255,255,255,.18)';
  }));
}
function renderRecPill() {
  const pill = $('#rec-pill');
  const show = MIC.on && !(S.view === 'room' && S.room && S.room.id === MIC.mid);
  pill.classList.toggle('hidden', !show);

}
function renderMicBox() {
  const R = S.room; const box = $('#mic-box'); if (!R || !R.meeting) return;
  if (R.meeting.status === 'ended') {

/* ---------- Thu mẫu giọng (10 giây) ---------- */
function openVoiceStudio() {
  const REC_S = 10;
  let cap = null, chunks = [], timer = null, startAt = 0;
  const modal = openModal(`
    <h3 class="text-lg font-semibold mb-1">Thu mẫu giọng</h3>
    <p class="text-muted text-[13px] mb-4">Người được thu đọc to đoạn bên dưới khoảng 10 giây, ở nơi yên tĩnh.</p>
    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="field" for="vs-name">Họ và tên</label><input id="vs-name" class="input" required placeholder="Ví dụ: Bùi Hồng Phúc"></div>
        <div><label class="field" for="vs-role">Chức danh</label><input id="vs-role" class="input" placeholder="Ví dụ: Product Manager"></div>
        <div><label class="field" for="vs-dept">Phòng ban</label><input id="vs-dept" class="input" placeholder="Ví dụ: Merchant Solutions"></div>
      </div>
      <blockquote class="rounded-xl p-3 text-[13.5px] leading-relaxed" style="background:rgba(255,255,255,.04);border:1px solid var(--line)">
        "Tôi là thành viên UrBox. Tôi đồng ý lưu đặc trưng giọng nói của mình để hệ thống tự nhận ra tôi trong các cuộc họp nội bộ. Hôm nay tôi sẽ trao đổi về tiến độ công việc và các kế hoạch sắp tới."
      </blockquote>
      <label class="flex items-start gap-2 text-[13px]"><input id="vs-consent" type="checkbox" class="mt-1"><span>Người được thu đã đồng ý lưu dữ liệu giọng nói.</span></label>
      <div class="flex items-center gap-3">
        <button id="vs-rec" class="btn btn-primary" type="button">Bắt đầu thu</button>
        <span id="vs-time" class="num text-muted">0 / ${REC_S} giây</span>
        <span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <p id="vs-msg" class="text-[13px] hidden"></p>
      <div class="flex justify-end"><button type="button" class="btn btn-ghost" data-act="modal-close">Đóng</button></div>
    </div>`);
  const btn = $('#vs-rec', modal), msg = $('#vs-msg', modal);
  const say = (t, err) => { msg.textContent = t; msg.classList.remove('hidden'); msg.style.color = err ? 'rgb(var(--danger))' : 'rgb(var(--accent))'; };
  const stopRec = () => { clearInterval(timer); timer = null; if (cap) { cap.stop(); cap = null; } MIC.level = 0; paintMeters(); };
  modalCloser = stopRec;
  btn.addEventListener('click', async () => {
    if (cap) { stopRec(); return upload(); }
    if (!$('#vs-name', modal).value.trim()) { say('Nhập họ và tên trước khi thu.', true); return; }
    if (!$('#vs-consent', modal).checked) { say('Cần xác nhận người được thu đã đồng ý.', true); return; }
    msg.classList.add('hidden'); chunks = [];
    try { cap = await createCapture(pcm => chunks.push(pcm), rms => { if (!MIC.on) { MIC.level = rms; paintMeters(); } }); }
    catch (e) { say(`Không mở được micro: ${e.message || e}`, true); return; }
    startAt = Date.now(); btn.textContent = 'Hoàn tất sớm'; btn.classList.replace('btn-primary', 'btn-danger');
    timer = setInterval(() => {
      const s = (Date.now() - startAt) / 1000;
      $('#vs-time', modal).textContent = `${Math.min(REC_S, Math.floor(s))} / ${REC_S} giây`;
      if (s >= REC_S) { stopRec(); upload(); }
    }, 200);
  });
  async function upload() {
    btn.textContent = 'Bắt đầu thu'; btn.classList.replace('btn-danger', 'btn-primary');
    const total = chunks.reduce((a, c) => a + c.length, 0);
    if (total < 16000 * 3) { say('Bản thu quá ngắn, hãy đọc ít nhất 5 giây.', true); return; }
    const all = new Int16Array(total); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
    const form = new FormData();
    form.append('name', $('#vs-name', modal).value.trim());
    form.append('role', $('#vs-role', modal).value.trim());
    form.append('department', $('#vs-dept', modal).value.trim());
    form.append('audio', new Blob([all.buffer], { type: 'application/octet-stream' }), 'voice.pcm');
    btn.disabled = true; say('Đang lưu mẫu giọng...');
    try {
      const d = await api('POST', '/api/voices/enroll-audio', form);
      say(`Đã lưu mẫu giọng của ${d.name} (${d.voiced_seconds} giây tiếng nói rõ).`);
      toast(`Đã lưu mẫu giọng của ${d.name}.`);
      if (S.view === 'voices') loadVoices(); else S.voices = [];
    } catch (e) { say(e.message, true); }
    finally { btn.disabled = false; }
  }
}

/* =====================================================================
   SỰ KIỆN CHUNG (event delegation)
   ===================================================================== */
document.addEventListener('click', async e => {
  if (!e.target.closest('#popover') && !e.target.closest('[data-act$="-menu"]')) closeMenu();
  if (e.target.matches('[data-modal-bg]')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const sid = el.dataset.sid ? parseInt(el.dataset.sid, 10) : null;
  const mid = el.dataset.mid ? parseInt(el.dataset.mid, 10) : null;
  switch (act) {
    case 'create-meeting': return openCreateMeeting();
    case 'open-meeting': location.hash = `#/m/${mid}`; return;
    case 'nav-room': { const t = S.room ? S.room.id : MIC.mid; if (t) location.hash = `#/m/${t}`; return; }
    case 'go-recording': if (MIC.mid) location.hash = `#/m/${MIC.mid}`; return;
    case 'meeting-menu': {
      e.stopPropagation();
      const c = await openMenu(el, [{ id: 'open', text: 'Mở cuộc họp' }, { id: 'export', text: 'Xuất Markdown' }, { id: 'delete', text: 'Xóa cuộc họp', danger: true }]);
      if (c === 'open') location.hash = `#/m/${mid}`;
      if (c === 'export') exportMarkdown(mid);
      if (c === 'delete') deleteMeeting(mid);
      return;
    }
    case 'room-menu': {
      const R = S.room; if (!R) return;
      const c = await openMenu(el, [{ id: 'export', text: 'Xuất Markdown' }, { id: 'delete', text: 'Xóa cuộc họp', danger: true }]);
      if (c === 'export') exportMarkdown(R.id);
      if (c === 'delete') deleteMeeting(R.id);
      return;
    }
    case 'hub-filter':
      S.filter = el.dataset.filter;
      $$('[data-act="hub-filter"]').forEach(b => b.setAttribute('aria-selected', b === el ? 'true' : 'false'));
      return renderHub();
    case 'mic-toggle': if (!S.room) return; return (MIC.on && MIC.mid === S.room.id) ? stopMic() : startMic(S.room.id);
    case 'end-meeting': return endMeeting();
    case 'rename': if (sid) return openRename(sid); return;
    case 'spk-menu': return speakerMenu(el, sid);
    case 'line-menu': return lineMenu(el, parseInt(el.dataset.seq, 10));
    case 'infer-names': return inferNames();
    case 'sugg-accept': return resolveSuggestion(parseInt(el.dataset.iid, 10), true);
    case 'sugg-dismiss': return resolveSuggestion(parseInt(el.dataset.iid, 10), false);
    case 'jump-latest': { const b = $('#t-scroll'); b.scrollTop = b.scrollHeight; el.classList.add('hidden'); return; }
    case 'tab': return switchTab(el.dataset.tab);
    case 'quick': switchTab('jarvis'); return submitAsk(el.dataset.prompt);
    case 'open-art': {
      const art = S.room.artifacts.find(a => a.id === parseInt(el.dataset.aid, 10));
      if (art) { S.room.artSel[art.kind] = art.id; switchTab(art.kind); }
      return;
    }
    case 'web-viewport': S.room.vp = el.dataset.vp; return renderArtifactPane();
    case 'web-popout': return popoutWeb();
    case 'room-pane':
      $$('[data-act="room-pane"]').forEach(b => b.setAttribute('aria-selected', b === el ? 'true' : 'false'));
      $$('.room-grid > [data-pane]').forEach(p => p.classList.toggle('pane-active', p.dataset.pane === el.dataset.pane));
      return;
    case 'voice-studio': return openVoiceStudio();
    case 'voice-edit': return openEditVoice(parseInt(el.dataset.vid, 10));
    case 'voice-delete': return deleteVoice(parseInt(el.dataset.vid, 10));
    case 'diag': return openDiagnostics();
    case 'modal-close': return closeModal();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); if ($('#modal-root').innerHTML) closeModal(); }
  if (e.key === 'Enter' && e.target.matches('.mrow[data-act="open-meeting"]')) location.hash = `#/m/${e.target.dataset.mid}`;
});

/* Khởi động */
loadHealth();
route();
setInterval(loadHealth, 60000);
</script>
</body>
</html>
