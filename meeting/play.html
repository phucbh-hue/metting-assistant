<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chơi cùng UrBox</title>
<style>
  :root { --brand: #6821C2; --brand2: #8235E4; --gold: #FFB700; --ink: #1F1B2E; --muted: #6B6680; --bg: #F5F3FA;
          --ok: #12A150; --bad: #E5484D; --a: #8235E4; --b: #2F80ED; --c: #F2A900; --d: #12A150; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(118deg, #5A16AD, #6821C2 40%, #8235E4 80%); color: #fff; padding: 18px 18px 22px; }
  header .t { font-size: 13px; opacity: .85; }
  header h1 { margin: 4px 0 0; font-size: 21px; line-height: 1.25; }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
  .card { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 6px 18px rgba(80, 40, 140, .08); }
  .muted { color: var(--muted); font-size: 14px; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 14px; border: 2px solid #E3DDF0; outline: none; }
  input:focus { border-color: var(--brand2); }
  button { font: inherit; border: 0; cursor: pointer; }
  .primary { width: 100%; margin-top: 10px; padding: 15px; border-radius: 14px; background: var(--brand); color: #fff; font-weight: 700; font-size: 17px; }
  .primary:disabled { opacity: .5; }
  .q { font-size: 19px; font-weight: 700; line-height: 1.4; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; color: #fff; font-size: 17px; font-weight: 600; text-align: left; min-height: 64px; }
  .opt b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .22); flex: none; }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .35; }
  .opt.pick { outline: 4px solid var(--ink); outline-offset: 2px; }
  .bar { height: 10px; border-radius: 99px; background: #E9E3F5; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--brand2)); transition: width .25s linear; }
  .big { font-size: 40px; font-weight: 800; text-align: center; margin: 4px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; background: #EFE7FB; color: var(--brand); font-size: 13px; font-weight: 600; }
  .gift { font-size: 15px; background: #FFF6DB; border-radius: 14px; padding: 12px 14px; }
  /* kéo co giữa các văn phòng */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .team { padding: 14px 10px; border-radius: 14px; border: 2px solid #E3DDF0; background: #fff; font-weight: 700; font-size: 16px; color: var(--ink);
          display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .team small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .team.on { border-color: var(--brand2); background: #F1E8FF; color: var(--brand); }
  .tug { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; margin-top: 10px; }
  .tug .r { text-align: right; } .tug small { display: block; font-weight: 500; color: var(--muted); }
  .rope { position: relative; height: 16px; border-radius: 99px; background: #F2B000; }
  .rope i { position: absolute; inset: 0 auto 0 0; border-radius: 99px 0 0 99px; background: linear-gradient(90deg, #7A2BE0, #9B4DF0); transition: width .8s; }
  .rope em { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: left .8s; }
  .tw { text-align: left; font-size: 14px; margin: 8px 0; } .tw b { color: var(--brand); }
  ol { margin: 6px 0 0; padding-left: 20px; } li { margin: 4px 0; }
  #net { text-align: center; font-size: 13px; color: var(--bad); padding: 0 16px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 0 18px; }
</style>
</head>
<body>
<header><div class="t">UrBox Meeting Copilot</div><h1 id="title">Đang vào trò chơi...</h1></header>
<main id="app"><div class="card muted">Đang tải...</div></main>
<div id="net" hidden></div>
<footer>Trả lời trên điện thoại hoặc nói đáp án to và rõ trong phòng họp.</footer>
<script>
const CODE = location.pathname.split('/').filter(Boolean)[1] || '';
const KEY = `ub_play_${CODE}`;
const COLORS = ['var(--a)', 'var(--b)', 'var(--c)', 'var(--d)'];
const L = 'ABCD';
let pid = ''; try { pid = localStorage.getItem(KEY) || ''; } catch (e) { /* trình duyệt chặn lưu trữ */ }
let st = null, skew = 0, timer = null, sending = false;
let lastSig = '';       // chỉ vẽ lại khi nội dung đổi: vẽ lại mỗi lần tải trạng thái làm mất chữ đang gõ, mất lượt bấm
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
async function api(path, body) {
  const r = await fetch(`/play/${encodeURIComponent(CODE)}${path}`, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.detail || 'Có lỗi, thử lại giúp em'), { status: r.status });
  return d;
}
function net(msg) { const el = $('#net'); el.textContent = msg || ''; el.hidden = !msg; }
async function poll() {
  try {
    st = await api(`/state${pid ? `?pid=${encodeURIComponent(pid)}` : ''}`);
    skew = (st.now || Date.now() / 1000) - Date.now() / 1000;
    if (st.me && pid && !st.me.joined) { pid = ''; try { localStorage.removeItem(KEY); } catch (e) { /* bỏ qua */ } }
    net('');
    render();
  } catch (e) {
    if (!st) { lastSig = ''; $('#app').innerHTML = `<div class="card"><b>Không vào được trò chơi</b><p class="muted">${esc(e.message)}</p></div>`; }
    else if (e.status === 404) return net('Trò chơi đã đóng.');      // giữ màn hình cuối cùng
    else net('Mạng chập chờn, đang kết nối lại...');                 // giữ nguyên màn hình và tên đang gõ
  }
  if (st && st.ended) return;                    // lượt đã xong: kết quả không đổi nữa
  clearTimeout(timer); timer = setTimeout(poll, st && ['answering', 'closing', 'lucky'].includes(st.phase) ? 700 : 1200);
}
function left() { return st && st.deadline ? Math.max(0, st.deadline - (Date.now() / 1000 + skew)) : 0; }
function tugHtml(ts) {                              // dây kéo co: 2 văn phòng thì một dây, nhiều hơn thì mỗi đội một thanh
  if (ts.length === 2) {
    const [a, b] = ts; const p = Math.round((a.share == null ? .5 : a.share) * 100);
    return `<div class="tug"><div>${a.lead ? '🔥 ' : ''}${esc(a.name)}<small>${a.points} điểm</small></div><div class="rope"><i style="width:${p}%"></i><em style="left:${p}%"></em></div><div class="r">${esc(b.name)}${b.lead ? ' 🔥' : ''}<small>${b.points} điểm</small></div></div>`;
  }
  return ts.map(t => `<div class="tug" style="margin-top:4px"><div>${t.lead ? '🔥 ' : ''}${esc(t.name)}</div><div class="rope" style="background:#E9E3F5"><i style="width:${Math.round((t.share || 0) * 100)}%"></i></div><div class="r">${t.points}</div></div>`).join('');
}
function render() {
  $('#title').textContent = st.title || 'Trò chơi';
  const me = st.me || {};
  const app = $('#app');
  if (!pid) {
    if (['final', 'lucky', 'stopped'].includes(st.phase)) {      // hết câu hỏi: không vào chơi được nữa
      if (lastSig !== 'ended') { lastSig = 'ended'; app.innerHTML = '<div class="card">Trò chơi đã kết thúc. Cảm ơn anh chị!</div>'; }
      return;
    }
    if ($('#nm')) {                              // đang nhập tên: giữ nguyên ô nhập, chỉ cập nhật chữ xung quanh
      $('#theme').textContent = st.theme || ''; $('#prize').textContent = st.team_prize || st.prize || '';
      app.querySelectorAll('.team').forEach(b => { const t = (st.teams || []).find(x => x.name === b.dataset.team); const s = b.querySelector('small'); if (t && s) s.textContent = `${t.players} người đã vào`; });
      return;
    }
    lastSig = 'join';
    const teams = st.teams || [];
    app.innerHTML = `<div class="card"><p class="muted" style="margin-top:0" id="theme">${esc(st.theme || '')}</p>
      <label for="nm" class="muted">Tên hiện trên bảng điểm</label>
      <input id="nm" maxlength="30" placeholder="Ví dụ: Lan - Marketing" autocomplete="nickname" enterkeyhint="go">
      ${teams.length ? `<div class="muted" style="margin-top:12px">Văn phòng của mình</div><div class="teams">${teams.map(t => `<button type="button" class="team" data-team="${esc(t.name)}">${esc(t.name)}<small>${t.players} người đã vào</small></button>`).join('')}</div>` : ''}
      <button class="primary" id="go">Vào chơi</button></div>
      <div class="gift">Phần thưởng: <b id="prize">${esc(st.team_prize || st.prize || '')}</b>${st.lucky_prize ? `<br>Quay số may mắn: <b>${esc(st.lucky_prize)}</b>` : ''}</div>`;
    app.querySelectorAll('.team').forEach(b => b.onclick = () => app.querySelectorAll('.team').forEach(x => x.classList.toggle('on', x === b)));
    $('#go').onclick = join; $('#nm').onkeydown = e => { if (e.key === 'Enter') join(); };
    $('#nm').focus();
    return;
  }
  const teamy = (st.teams || []).length > 0;   // kéo co giữa các văn phòng
  const sig = JSON.stringify([st.phase, st.qi, st.phase === 'lobby' ? st.players : 0, me.joined, me.name, me.choice,
    me.points, me.rank, me.alive, me.gain, st.reveal ? st.reveal.answer : null, st.lucky ? st.lucky.winner : null,
    (st.winners || []).map(w => w.name).join('|'), (st.teams || []).map(t => `${t.points}:${t.players}`).join('|'), me.team_rank, st.champion]);
  if (sig === lastSig) return;                   // không đổi gì: thanh thời gian tự chạy, không vẽ lại cả khung
  lastSig = sig;
  const head = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <div><div style="font-weight:700">${esc(me.name || '')}${me.team ? ` <span class="pill">${esc(me.team)}</span>` : ''}</div><div class="muted">${me.points || 0} điểm${me.team && me.team_rank && me.points ? `, hạng ${me.team_rank} ở ${esc(me.team)}` : me.rank && me.points ? `, hạng ${me.rank}` : ''}${st.format === 'golden_bell' && st.qi >= 0 ? (me.alive ? ', đang trụ lại' : ', đã bị loại') : ''}</div></div>
    ${st.total && st.qi >= 0 && st.phase !== 'final' ? `<span class="pill">Câu ${st.qi + 1}/${st.total}</span>` : ''}
    ${teamy && st.qi >= 0 ? `<div style="flex-basis:100%">${tugHtml(st.teams)}</div>` : ''}</div>`;
  const q = st.question;
  let body = '';
  if (st.phase === 'lobby') {
    body = `<div class="card"><div class="big">Đã vào!</div><p class="muted" style="text-align:center">${me.team ? `Anh chị chơi cho văn phòng <b>${esc(me.team)}</b>. ` : ''}Chờ người dẫn bắt đầu. ${st.players} người đang chơi${teamy ? ` (${st.teams.map(t => `${esc(t.name)} ${t.players}`).join(', ')})` : ''}.</p>
      ${(st.rules || []).length ? `<ol>${st.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ol>` : ''}</div>
      <div class="gift">Phần thưởng: <b>${esc(st.team_prize || st.prize || '')}</b>${st.lucky_prize ? `<br>Quay số may mắn: <b>${esc(st.lucky_prize)}</b>` : ''}</div>`;
  } else if (q && (st.phase === 'reading' || st.phase === 'answering' || st.phase === 'closing')) {
    const open = st.phase === 'answering' && left() > 0 && me.alive !== false;
    const picked = me.choice;
    body = `<div class="card"><div class="q">${esc(q.q)}</div>
      ${st.phase === 'answering' ? `<div class="bar" style="margin-top:12px"><i id="bar" style="width:${(left() / q.time) * 100}%"></i></div>` : `<p class="muted">${st.phase === 'reading' ? 'Nghe câu hỏi...' : 'Đang chốt đáp án...'}</p>`}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt ${picked != null && picked !== i ? 'dim' : ''} ${picked === i ? 'pick' : ''}" data-i="${i}" style="background:${COLORS[i]}" ${open && picked == null ? '' : 'disabled'}>
        <b>${q.type === 'truefalse' ? (i === 0 ? '✓' : '✗') : L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
      ${picked != null ? `<p class="muted" style="text-align:center">Đã chốt đáp án ${q.type === 'truefalse' ? esc(q.options[picked]) : L[picked]}. Chờ công bố nhé!</p>` : ''}
      ${me.alive === false ? '<p class="muted" style="text-align:center">Anh chị đã bị loại ở câu trước, xem tiếp cùng mọi người nhé.</p>' : ''}`;
  } else if (q && (st.phase === 'reveal' || st.phase === 'scores') && st.reveal) {
    const right = st.reveal.answer, mine = me.choice;
    const won = mine === right;
    body = `<div class="card" style="text-align:center"><div class="big ${won ? 'ok' : 'bad'}">${mine == null ? 'Chưa trả lời' : won ? `+${me.gain || 0}` : 'Chưa đúng'}</div>
      <p>Đáp án đúng: <b>${q.type === 'truefalse' ? esc(q.options[right]) : `${L[right]}. ${esc(q.options[right])}`}</b></p>
      ${st.reveal.explain ? `<p class="muted">${esc(st.reveal.explain)}</p>` : ''}
      ${teamy && st.reveal.team_gains ? `<p class="muted">${Object.entries(st.reveal.team_gains).map(([t, p]) => `<b>${esc(t)}</b> +${p}`).join(' · ') || 'Chưa văn phòng nào ghi điểm câu này'}</p>` : ''}</div>`;
  } else if (st.phase === 'lucky' && st.lucky) {
    body = `<div class="card" style="text-align:center"><div class="muted">Quay số may mắn</div><div class="big" id="spin">...</div></div>`;
    spin();
  } else if ((st.phase === 'final' || st.phase === 'stopped') && teamy) {
    const tw = st.team_winners || {}; const mine = tw[me.team] || []; const inTop = mine.some(w => w.name === me.name);
    body = `<div class="card" style="text-align:center"><div class="muted">Kết thúc</div>
      <div class="big">${st.champion ? `🏆 ${esc(st.champion)}` : st.phase === 'stopped' ? 'Đã dừng' : 'Hòa nhau!'}</div>
      ${st.champion ? '<p class="muted" style="margin-top:0">thắng kéo co!</p>' : ''}
      ${inTop ? `<p class="ok"><b>Chúc mừng! Anh chị lọt Top ${st.top_n || 3} văn phòng ${esc(me.team)}, nhận ${esc(st.team_prize || st.prize || 'quà')}.</b></p>` : `<p class="muted">${me.team_rank ? `Anh chị xếp hạng ${me.team_rank} ở ${esc(me.team)}.` : 'Cảm ơn anh chị đã chơi!'}</p>`}
      ${Object.entries(tw).map(([t, ws]) => `<div class="tw"><b>${esc(t)}</b>: ${ws.length ? ws.map((w, i) => `${i + 1}. ${esc(w.name)} (${w.points})`).join(' · ') : 'chưa có điểm'}</div>`).join('')}
      ${st.lucky ? `<p>🎁 May mắn: <b>${esc(st.lucky.winner)}</b></p>` : ''}</div>`;
  } else if (st.phase === 'final' || st.phase === 'stopped') {
    const w = (st.winners || []).map(x => esc(x.name)).join(', ');
    body = `<div class="card" style="text-align:center"><div class="muted">Kết thúc</div>
      <div class="big">${me.rank === 1 ? 'Vô địch!' : me.rank ? `Hạng ${me.rank}` : 'Cảm ơn!'}</div>
      ${w ? `<p>Người thắng: <b>${w}</b></p>` : ''}${st.lucky ? `<p>May mắn: <b>${esc(st.lucky.winner)}</b></p>` : ''}
      <p class="muted">Phần thưởng: ${esc(st.prize || '')}</p></div>`;
  } else body = '<div class="card muted">Chờ câu hỏi tiếp theo...</div>';
  app.innerHTML = head + body;
  app.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i, 10)));
}
function spin() {
  const names = (st.lucky && st.lucky.names) || []; if (!names.length) return;
  const end = (st.lucky.at - skew) * 1000 + 6000; let i = 0;
  const tick = () => { const el = $('#spin'); if (!el) return;
    if (Date.now() >= end) { el.textContent = st.lucky.winner; return; }
    el.textContent = names[i++ % names.length]; setTimeout(tick, 80 + Math.max(0, 6000 - (end - Date.now())) / 18); };
  tick();
}
setInterval(() => { const b = $('#bar'); if (b && st && st.question) b.style.width = `${(left() / st.question.time) * 100}%`; }, 200);
function joinErr(text) {
  let msg = $('#joinerr'); if (!msg) { msg = document.createElement('p'); msg.id = 'joinerr'; msg.className = 'bad'; $('#go').after(msg); }
  msg.textContent = text;
}
async function join() {
  const name = ($('#nm').value || '').trim(); if (!name) return $('#nm').focus();
  const tb = $('.team.on'); const team = tb ? tb.dataset.team : '';
  if ((st.teams || []).length && !team) return joinErr('Chọn văn phòng của mình trước nhé');
  $('#go').disabled = true;
  try { const r = await api('/join', { name, team }); pid = r.pid; try { localStorage.setItem(KEY, pid); } catch (e) { /* chỉ giữ trong phiên */ } poll(); }
  catch (e) { $('#go').disabled = false; joinErr(e.message); }
}
async function answer(i) {
  if (sending) return; sending = true;
  try { await api('/answer', { pid, choice: i }); if (st.me) st.me.choice = i; render(); }
  catch (e) { /* hết giờ: lượt sau */ }
  finally { sending = false; }
}
poll();
</script>
</body>
</html>
