<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------- tokens */
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f8fafc;--sunken:#f1f5f9;
  --fg:#0f172a;--fg-2:#334155;--mut:#64748b;--faint:#94a3b8;
  --line:#e2e8f0;--line-2:#cbd5e1;
  --acc:#4f46e5;--acc-2:#4338ca;--acc-soft:#eef2ff;--acc-line:#c7d2fe;--on-acc:#fff;
  --ok:#059669;--ok-soft:#ecfdf5;--ok-line:#a7f3d0;
  --warn:#b45309;--warn-soft:#fffbeb;--warn-line:#fde68a;
  --err:#dc2626;--err-soft:#fef2f2;--err-line:#fecaca;
  --me:#f1f5f9;--me-fg:#0f172a;--cand:#eef2ff;--cand-fg:#312e81;
  --ring:0 0 0 3px rgba(79,70,229,.18);
  --sh-1:0 1px 2px rgba(15,23,42,.04);--sh-2:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --r:16px;--r-sm:11px;--r-xs:8px;--av-l:92%;--av-d:32%;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12;--surface:#12151c;--surface-2:#161a22;--sunken:#1a1f29;
  --fg:#e7eaf0;--fg-2:#c3cad6;--mut:#8b95a7;--faint:#5d6778;
  --line:#232a36;--line-2:#303947;
  --acc:#818cf8;--acc-2:#a5b4fc;--acc-soft:#1e2140;--acc-line:#3730a3;--on-acc:#0b0d12;
  --ok:#34d399;--ok-soft:#0f2a22;--ok-line:#14532d;--warn:#fbbf24;--warn-soft:#2a220d;--warn-line:#713f12;
  --err:#f87171;--err-soft:#2c1215;--err-line:#7f1d1d;
  --me:#1a1f29;--me-fg:#e7eaf0;--cand:#1e2140;--cand-fg:#c7d2fe;
  --ring:0 0 0 3px rgba(129,140,248,.25);--sh-1:none;--sh-2:0 8px 28px rgba(0,0,0,.35);--av-l:26%;--av-d:82%;
}}
/* ------------------------------------------------------------- base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.sm{width:15px;height:15px;vertical-align:-2px}svg.i.lg{width:22px;height:22px}
.mut{color:var(--mut)}.faint{color:var(--faint)}.small{font-size:13px}.xs{font-size:12px}.err{color:var(--err)}
.num{font-variant-numeric:tabular-nums}
/* ------------------------------------------------------------- top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.brand:hover{text-decoration:none}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);box-shadow:0 4px 14px rgba(99,102,241,.35)}
.logo svg{width:18px;height:18px;stroke:#fff}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;color:var(--mut);font-weight:500;font-size:14px}
.nav a:hover{background:var(--sunken);color:var(--fg);text-decoration:none}
.nav a.on{background:var(--acc-soft);color:var(--acc)}
.status{margin-left:auto;display:flex;gap:6px;align-items:center}
@media(max-width:760px){.status{display:none}.nav a span{display:none}.top-in{gap:12px;padding:0 14px}}
/* ------------------------------------------------------------- layout */
.wrap{max-width:1240px;margin:0 auto;padding:26px 24px 90px}
@media(max-width:760px){.wrap{padding:18px 14px 80px}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--mut)}.crumb a:hover{color:var(--fg)}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
h2{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:12px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.sub{color:var(--mut);margin-top:6px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-side{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.grid2,.grid-side{grid-template-columns:minmax(0,1fr)}}   /* 1fr giữ min-content -> tràn ngang trên mobile */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack>*+*{margin-top:18px}
/* ------------------------------------------------------------- card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:20px}
.card+.card{margin-top:18px}
.grid2>.card+.card,.grid-side>.card+.card{margin-top:0}   /* nằm CẠNH nhau trong lưới thì không cần khoảng cách trên */
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .count{font-size:12px;font-weight:600;color:var(--mut);background:var(--sunken);border-radius:999px;padding:1px 8px}
.card-h .spacer+*{margin-left:auto}
.section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
/* ------------------------------------------------------------- buttons */
button{font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 15px;cursor:pointer;
  background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;box-shadow:0 1px 2px rgba(15,23,42,.08)}
button:hover{background:var(--acc-2)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.sec{background:var(--surface);color:var(--fg);border-color:var(--line-2);box-shadow:var(--sh-1)}
button.sec:hover{background:var(--sunken)}
button.ghost{background:transparent;color:var(--mut);box-shadow:none}
button.ghost:hover{background:var(--sunken);color:var(--fg)}
button.danger{background:var(--err);color:#fff}button.danger:hover{filter:brightness(.95)}
button.ok{background:var(--ok);color:#fff}
button.sm{padding:6px 11px;font-size:13px;border-radius:var(--r-xs)}
button.icon{padding:7px}
button.big{font-size:16px;padding:15px 22px;width:100%;border-radius:14px}
button.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 24px rgba(79,70,229,.32)}
button.hero:hover{filter:brightness(1.05)}
/* ------------------------------------------------------------- forms */
input,textarea,select{font:inherit;font-size:14px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:var(--ring)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);margin:0;flex:none}
textarea{min-height:92px;resize:vertical;line-height:1.5}
label{font-size:13px;font-weight:550;color:var(--fg-2);display:block;margin:14px 0 6px}
label .mut{font-weight:400}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--fg-2);font-size:13.5px;cursor:pointer;margin:12px 0}
.check input{margin-top:2px}
/* ------------------------------------------------------------- chips / tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--mut);white-space:nowrap;border:1px solid transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.tag.err{background:var(--err-soft);color:var(--err);border-color:var(--err-line)}
.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--mut);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.ok i{background:var(--ok)}.pill.err i{background:var(--err)}.pill.warn i{background:var(--warn)}
/* ------------------------------------------------------------- lists */
.list{display:flex;flex-direction:column;gap:8px}
.list a.item{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--fg);background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .1s}
.list a.item:hover{border-color:var(--acc-line);box-shadow:var(--sh-2);text-decoration:none}
.item .t{font-weight:600}.item .m{font-size:13px;color:var(--mut);margin-top:1px}
.item .go{margin-left:auto;color:var(--faint);display:flex;align-items:center;gap:10px}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .ic{width:46px;height:46px;border-radius:14px;background:var(--sunken);display:grid;place-items:center;margin:0 auto 10px;color:var(--faint)}
/* avatar: màu theo tên, ổn định giữa các lần vẽ */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13.5px;
  background:hsl(var(--h,230) 70% var(--av-l));color:hsl(var(--h,230) 55% var(--av-d))}
.av.sq{border-radius:10px}.av.lg{width:44px;height:44px;font-size:16px}
/* ------------------------------------------------------------- misc components */
.comp{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--surface-2)}
.comp+.comp{margin-top:10px}
.comp .ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:8px;list-style:none;display:inline-flex;align-items:center;gap:5px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:15px}
details[open] summary::before{transform:rotate(90deg)}
details.box{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px}
details.box>summary{margin:0;color:var(--fg-2);font-weight:600;font-size:14px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-sm);background:var(--sunken);color:var(--fg-2);font-size:13px}
.hint.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.hint.acc{background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.readme{padding:14px 16px;border-radius:var(--r-sm);border:1px dashed var(--acc-line);background:var(--acc-soft);color:var(--cand-fg);font-size:14.5px;line-height:1.6}
.bar{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:650;background:var(--surface-2)}
td.sc{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--acc-line);color:var(--fg-2);font-size:13px;background:var(--surface-2);border-radius:0 8px 8px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;max-width:92vw;box-shadow:var(--sh-2);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .75s linear infinite;vertical-align:-2px;opacity:.85}
@keyframes r{to{transform:rotate(360deg)}}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--sunken),var(--line),var(--sunken));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* ------------------------------------------------------------- live session */
.live{position:sticky;top:60px;z-index:10;margin:-26px -24px 18px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media(max-width:760px){.live{margin:-18px -14px 14px;padding:12px 14px}}
.live-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rec{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--err);background:var(--err-soft);border:1px solid var(--err-line);padding:4px 10px 4px 8px;border-radius:999px}
.rec.prep{color:var(--acc);background:var(--acc-soft);border-color:var(--acc-line)}
.live-row{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);flex-wrap:wrap}
#lives>.card{margin-bottom:18px}
.live-row .grow{flex:1;min-width:180px}
.live-row .t{font-weight:600}.live-row .m{color:var(--mut);font-size:13px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--err);box-shadow:0 0 0 0 rgba(220,38,38,.5);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.clock{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sess{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media(max-width:1000px){.sess{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2)}
#tr{height:calc(100vh - 290px);min-height:420px;overflow:auto;padding:18px 16px;scroll-behavior:smooth}
/* bong bóng hội thoại */
.seg{display:flex;gap:10px;max-width:86%;margin:0 0 14px;align-items:flex-start}
.seg .bd{min-width:0}
.seg .who{font-size:12.5px;font-weight:650;color:var(--fg-2);margin:0 0 4px 2px;display:flex;align-items:center;gap:6px;cursor:pointer}
.seg .who .t{font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.seg .who .crown{color:#d97706}
.seg .tx{padding:10px 14px;border-radius:4px 16px 16px 16px;background:var(--me);color:var(--me-fg);line-height:1.55;word-wrap:break-word}
.seg.candidate{margin-left:auto;flex-direction:row-reverse}
.seg.candidate .who{justify-content:flex-end;margin:0 2px 4px 0}
.seg.candidate .tx{background:var(--cand);color:var(--cand-fg);border-radius:16px 4px 16px 16px}
.seg.unknown{margin-left:auto;margin-right:auto}
.seg.unknown .tx{background:transparent;border:1px dashed var(--line-2);color:var(--fg-2)}
.seg.partial{opacity:.62}
.seg.partial .tx{background-image:linear-gradient(90deg,transparent,rgba(99,102,241,.06),transparent);background-size:200% 100%;animation:sh 1.6s infinite}
.interim{color:var(--mut);font-style:italic;padding:8px 16px;border-top:1px solid var(--line);min-height:38px;font-size:13.5px;background:var(--surface-2)}
.spkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spkbar .chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px dashed var(--line-2);background:var(--surface);color:var(--fg-2);box-shadow:none}
.spkbar .chip:hover{background:var(--sunken)}
.spkbar .chip.interviewer{background:var(--me);border-style:solid;border-color:var(--line)}
.spkbar .chip.candidate{background:var(--cand);color:var(--cand-fg);border-style:solid;border-color:var(--acc-line)}
.person{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.person .av{width:22px;height:22px;font-size:11px}
/* trợ lý */
.side{position:sticky;top:132px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;padding-bottom:6px}
.assist{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;background:var(--surface);box-shadow:var(--sh-1)}
.assist.draft{border-style:dashed;opacity:.85}
.assist .a-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.assist .q{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin:8px 0;position:relative}
.assist .q .qt{font-size:15px;font-weight:600;line-height:1.5;color:var(--fg)}
.assist .q .why{font-size:13px;color:var(--mut);margin-top:5px}
.assist .q .qb{font-size:12.5px;color:var(--fg-2);margin-top:6px;font-style:italic;opacity:.8}
.kind{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:4px;display:block}
.flag{color:var(--err);font-size:13.5px;margin-top:8px;display:flex;gap:6px}
.a-sum{font-size:13.5px;color:var(--fg-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
/* đánh giá */
.score-ring{--p:0;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--sunken) 0)}
.score-ring>div{width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.score-ring b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score-ring span{font-size:12px;color:var(--mut)}
.crow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
@media(max-width:700px){.crow{grid-template-columns:1fr}}
.ul{margin:0;padding-left:18px}.ul li{margin:4px 0;font-size:14px}
/* giọng nói */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:12px}
.vcard .vn{font-weight:650;font-size:15px}
.vcard .acts{display:flex;gap:6px;margin-top:auto}
.recbtn{position:relative}
.meter{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#10b981,#6366f1);transition:width .2s linear}
/* tải file, tiêu chí, độ phù hợp */
.lrow{display:flex;align-items:flex-end;gap:8px;margin:14px 0 6px}.lrow label{margin:0;flex:1;min-width:0}
textarea.drop{border-color:var(--acc);box-shadow:var(--ring);background:var(--acc-soft)}
.wbar{display:flex;gap:3px;height:9px;margin:0 0 12px}.wbar i{border-radius:999px;background:hsl(var(--h) 62% 62%);min-width:6px}
ul.req{list-style:none;margin:0;padding:0}.req li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:6px 0;color:var(--fg-2)}.req li svg{margin-top:3px;color:var(--mut)}
.reqs{display:flex;flex-direction:column;gap:9px}.rq{display:flex;gap:10px;align-items:flex-start}.rq>.tags{display:flex;gap:4px;align-items:center;flex:none}
.rq>.tags .tag{min-width:98px;justify-content:center}
.card-h h2{white-space:nowrap}
.tag.src{min-width:0;flex:0 1 auto}.tag.src .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

<header class="top"><div class="top-in">
  <a class="brand" href="#/"><span class="logo" id="logo"></span><span>Interview Assistant</span></a>
  <nav class="nav" id="nav"></nav>
  <div class="status" id="status"></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RATE=16000;
const IV_BASE='/interview';                      // app phỏng vấn mounted dưới /interview của Meeting
function _tok(){try{return localStorage.getItem('ma_token')||''}catch(e){return ''}}   // dùng chung đăng nhập Meeting
async function api(path,opt={}){
  const h={'content-type':'application/json',...(opt.headers||{})}; const t=_tok(); if(t)h.authorization='Bearer '+t;
  const r=await fetch(IV_BASE+'/api'+path,{...opt,headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
  if(r.status===401){location.href='/';return new Promise(()=>{})}   // chưa đăng nhập -> trang chính Meeting
  if(!r.ok){let t;try{t=(await r.json()).detail}catch{t=r.statusText}throw new Error(t)}
  return r.json();
}
function toast(m,err){const t=document.createElement('div');t.className='toast';t.textContent=m;if(err){t.style.background='var(--err)';t.style.color='#fff'}document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}
/* Nút gọi API tự khoá trong lúc chờ. Trên Render free, request đầu tiên sau khi
   app ngủ mất ~50s - đủ lâu để bấm lại vài lần, và mỗi cú bấm là một bản ghi mới:
   đã tạo ra 7 vị trí trùng tên như vậy (20/09). Trả nút về nguyên trạng ở finally
   kể cả khi handler điều hướng sang hash khác - lúc đó element đã bị route() thay,
   ghi vào nó vô hại. */
async function busy(id,label,fn){const b=typeof id==='string'?$(id):id;if(!b||b.disabled)return;
  const old=b.innerHTML;b.disabled=true;b.innerHTML=`<span class="spin"></span> ${label}`;
  try{return await fn()}catch(e){toast(e.message,true)}finally{b.disabled=false;b.innerHTML=old}}
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const dt=ts=>ts?new Date(ts*1000).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'}):'';
const REC={strong_yes:['Rất nên tuyển','ok'],yes:['Nên tuyển','ok'],maybe:['Cân nhắc','warn'],no:['Không','err'],strong_no:['Chắc chắn không','err']};
const rec=r=>{const [t,c]=REC[r]||[r,'']; return `<span class="tag ${c}">${esc(t)}</span>`};
const ROLE={interviewer:'Tôi',candidate:'Ứng viên'};

/* Bộ icon nét (kiểu Lucide), vẽ bằng path để khỏi phụ thuộc font emoji mỗi máy một kiểu. */
const IP={
  wave:'<path d="M2 12h2M6 8v8M10 4v16M14 7v10M18 10v4M22 12h0"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>',
  bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h0M15 13h0M9 17h6"/>',
  play:'<path d="M7 4v16l13-8z"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 3v4M21 5h-4"/>',
  brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',check:'<path d="M5 12l5 5L20 7"/>',
  alert:'<path d="M12 3l10 18H2zM12 10v5M12 18h0"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
  scale:'<path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0zM8 21h8"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  file:'<path d="M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
  upload:'<path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',minus:'<path d="M5 12h14"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5M12 17h0"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',hand:'<path d="M7 11V6a2 2 0 0 1 4 0v4M11 10V4a2 2 0 0 1 4 0v6M15 10V6a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-2-4a2 2 0 0 1 3-2l1 2"/>'
};
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${IP[n]||''}</svg>`;
const hue=s=>{let h=0;for(const ch of String(s||'?'))h=(h*31+ch.charCodeAt(0))%360;return h};
const ini=s=>(String(s||'?').trim().split(/\s+/).pop()||'?')[0].toUpperCase();
const av=(name,cls='')=>`<span class="av ${cls}" style="--h:${hue(name)}">${esc(ini(name))}</span>`;
const empty=(icon,text,extra='')=>`<div class="empty"><div class="ic">${I(icon,'lg')}</div><div>${text}</div>${extra}</div>`;
const liHTML=xs=>xs&&xs.length?`<ul class="ul">${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="small mut">-</p>';

/* ------------------------------------------------ tải file JD / CV / tiêu chí */
/* File đi dạng base64 trong JSON (server không nhận multipart). Server chỉ đọc chữ
   ra rồi bỏ file - không lưu file gốc. */
const MAXF=10*1024*1024;
const ACC_DOC='.pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp';
const ACC_CRIT='.xlsx,.docx,.pdf,.csv,.txt,.md,.png,.jpg,.jpeg';
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.display='none';
  document.body.appendChild(i);i.onchange=()=>{res([...i.files]);i.remove()};i.oncancel=()=>{res([]);i.remove()};i.click()})}
function b64file(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('Không đọc được file '+f.name));r.readAsDataURL(f)})}
/* Ảnh chụp CV bằng điện thoại hay 4-8MB, mà Claude chỉ nhận ảnh ~3.7MB: thu về cạnh dài
   2000px, JPEG - vẫn đọc rõ chữ, nhẹ hơn nhiều lần. Lỗi gì thì gửi nguyên ảnh. */
async function shrinkImage(f){if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size<=2.5e6)return f;
  try{const bmp=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    return blob&&blob.size<f.size?new File([blob],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch{return f}}
async function fileBody(f){f=await shrinkImage(f);if(f.size>MAXF)throw new Error(`${f.name}: ${(f.size/1e6).toFixed(1)}MB - tối đa 10MB`);return{filename:f.name,data:await b64file(f)}}
const readDoc=async(kind,f)=>api('/extract',{method:'POST',body:{kind,...await fileBody(f)}});
const baseName=f=>f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
/* Thả file thẳng vào ô nhập liệu - HR hay kéo file từ email/thư mục sang. */
function dropZone(el,onFile){if(!el)return;
  el.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();el.classList.add('drop')}});
  el.addEventListener('dragleave',()=>el.classList.remove('drop'));
  el.addEventListener('drop',e=>{el.classList.remove('drop');if(!e.dataTransfer.files.length)return;e.preventDefault();onFile(e.dataTransfer.files[0])})}

/* ---------------------------------------------- tiêu chí & độ phù hợp */
/* Tỷ trọng quy về % theo tỷ lệ: HR ghi 40/40/20, khung AI cũ ghi 1-5 - hiển thị như nhau. */
const pctOf=rub=>{const ws=(rub||[]).map(c=>Math.max(0,+c.weight||0)),t=ws.reduce((a,b)=>a+b,0);return ws.map(w=>t>0?w*100/t:100/(ws.length||1))};
const fitCls=m=>m==null?'':m>=75?'ok':m>=50?'warn':'err';
const REQ={met:['Đạt','ok','check'],partial:['Một phần','warn','minus'],not_met:['Không đạt','err','x'],unknown:['Chưa rõ','','help']};
const reqTag=s=>{const [t,c,ic]=REQ[s]||REQ.unknown;return `<span class="tag ${c}">${I(ic,'sm')} ${t}</span>`};
const SREC={interview:['Nên mời phỏng vấn','ok'],consider:['Cân nhắc','warn'],reject:['Chưa phù hợp','err']};
const srec=r=>{const [t,c]=SREC[r]||['',''];return t?`<span class="tag ${c}">${esc(t)}</span>`:''};
const delta=(a,b)=>a==null||b==null||a===b?'':`<span class="${b>a?'up':'down'}">${b>a?'▲':'▼'}${Math.abs(b-a)}</span>`;
/* Danh sách yêu cầu kèm trạng thái; `before` (bản chụp từ CV) thì hiện CV → sau phỏng vấn. */
const reqRows=(t,xs,before)=>(xs||[]).length?`<h3>${t}</h3><div class="reqs">${xs.map(x=>{const b=before&&before[x.requirement];
  return `<div class="rq"><span class="tags">${b&&b!==x.status?`${reqTag(b)}${I('arrow','sm')}`:''}${reqTag(x.status)}</span><div style="min-width:0"><div class="small">${esc(x.requirement)}</div>${x.note?`<div class="xs mut">${esc(x.note)}</div>`:''}</div></div>`}).join('')}</div>`:'';

/* ------------------------------------------------------------ router */
let teardown=null,H={};
/* NAV tăng mỗi lần chuyển trang. Mỗi trang ghi lại NAV lúc bắt đầu và bỏ dở nếu sau khi chờ dữ liệu
   thấy NAV đã khác. Không có nó thì server chậm (Render free, Neon vừa thức) mà người dùng bấm sang trang
   khác, trang cũ tải xong muộn sẽ đè lên trang mới, chiếm luôn teardown và để lại polling không ai dừng. */
let NAV=0;
let ME={};        // vai trò người dùng (admin/owner/user) từ /api/me - để ẩn/hiện và chặn phía UI
/* Giọng mẫu người phỏng vấn: PCM16 16kHz, CHỈ nằm trong bộ nhớ trang - không ghi ổ đĩa,
   không localStorage, vì đó là dữ liệu sinh trắc học. Dùng lại cho các buổi liền nhau
   tới khi tải lại trang hoặc bấm xoá. Server dùng nó một lần lúc mở luồng rồi bỏ. */
let PRIME=null;                                   // {b64, sec}
const PRIME_SEC=10;
const PRIME_TEXT='Xin chào, tôi là người phỏng vấn hôm nay. Cảm ơn bạn đã dành thời gian. Chúng ta sẽ bắt đầu bằng phần giới thiệu, sau đó tôi sẽ hỏi về kinh nghiệm và các dự án gần đây của bạn.';
/* Lựa chọn chủ phòng nhớ trong localStorage: chỉ là ID, tiện cho người dùng - không
   phải dữ liệu giọng. Đọc/ghi luôn bọc try vì cửa sổ ẩn danh có thể chặn. */
const pref={get:k=>{try{return JSON.parse(localStorage.getItem('ia.'+k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem('ia.'+k,JSON.stringify(v))}catch{}}};

function chrome_(active){
  $('logo').innerHTML=I('wave');
  $('nav').innerHTML=[['home','#/','briefcase','Vị trí'],['voices','#/voices','users','Giọng nói'],['settings','#/settings','gear','Cài đặt'],
      ...(ME.admin?[['roles','#/roles','shield','Phân quyền']]:[]),['meeting','/','arrow','← Meeting']]
    .map(([k,h,ic,t])=>`<a href="${h}" class="${k===active?'on':''}">${I(ic,'sm')}<span>${t}</span></a>`).join('');
  const roleT={admin:'Admin',owner:'Owner',user:'Người phỏng vấn'}[ME.role];
  $('status').innerHTML=(roleT?`<span class="pill" title="Quyền của bạn trong phần Phỏng vấn">${roleT}</span>`:'')+(H.soniox===undefined?'':
    `<span class="pill ${H.soniox?'ok':'err'}"><i></i>Soniox</span><span class="pill ${H.gemini||H.provider==='claude'?'ok':'err'}"><i></i>${esc(H.model||'model')}</span>`+
    `<span class="pill ${H.voice?'ok':'warn'}" title="${H.voice?'Có model so giọng từng câu':'Chưa có model nhận diện giọng'}"><i></i>So giọng</span>`);
}
async function route(){
  if(teardown){try{teardown()}catch{} teardown=null}
  const my=++NAV;
  const h=location.hash.replace(/^#\/?/,'').split('/');
  const app=$('app');
  const active=!h[0]||h[0]==='p'||h[0]==='c'||h[0]==='s'?'home':h[0];
  chrome_(active);
  if(H.soniox===undefined)api('/health').then(x=>{H=x;chrome_(active)}).catch(()=>{});
  if(ME.role===undefined)api('/me').then(x=>{ME=x;chrome_(active)}).catch(()=>{});
  app.innerHTML='<div class="skel" style="width:40%;height:26px"></div><div class="skel" style="margin-top:18px;height:120px"></div>';
  try{
    if(!h[0]) return await home(app);
    if(h[0]==='roles') return await rolesPage(app);
    if(h[0]==='settings') return await settings(app);
    if(h[0]==='voices') return await voices(app);
    if(h[0]==='p'&&h[2]==='compare') return await compare(app,+h[1]);
    if(h[0]==='p') return await position(app,+h[1]);
    if(h[0]==='c') return await candidate(app,+h[1]);
    if(h[0]==='s') return await session(app,+h[1]);
  }catch(e){if(my===NAV)app.innerHTML=`<div class="card">${empty('alert',esc(e.message),'<p><a href="#/">← Về trang chủ</a></p>')}</div>`}
}
addEventListener('hashchange',route);addEventListener('load',route);
const crumb=parts=>`<div class="crumb">${parts.map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:`<span>${esc(t)}</span>`).join(I('chev','sm'))}</div>`;

/* -------------------------------------------------------------- phân quyền (admin) */
async function rolesPage(app){
  if(!ME.admin){app.innerHTML=`<div class="card">${empty('shield','Chỉ admin xem được trang này.','<p><a href="#/">← Về trang chủ</a></p>')}</div>`;return}
  chrome_('roles');
  let d; try{d=await api('/roles')}catch(e){app.innerHTML=`<div class="card">${empty('alert',esc(e.message))}</div>`;return}
  const row=p=>`<div class="item"><div class="av" style="--h:${hue(p.name)}">${esc(ini(p.name))}</div>
    <div style="flex:1"><div class="t">${esc(p.name)}</div><div class="m">${esc(p.email)}</div></div>
    <span class="go">${p.role==='admin'?'<span class="tag">Admin</span>'
      :p.role==='owner'?`<span class="tag ok">Owner</span> <button class="ghost sm" data-r="user" data-e="${esc(p.email)}">Gỡ owner</button>`
      :`<span class="tag">Người phỏng vấn</span> <button class="sm" data-r="owner" data-e="${esc(p.email)}">Cấp owner</button>`}</span></div>`;
  app.innerHTML=`<div class="ph"><div><h1>Phân quyền</h1><div class="sub">Owner: tạo vị trí, đặt tiêu chí, tải/chấm CV. Người phỏng vấn (mặc định): xem vị trí được giao + chạy buổi phỏng vấn. Admin cố định theo cấu hình hệ thống.</div></div></div>
    <div class="card"><div class="list" id="rlist">${(d.people||[]).map(row).join('')||empty('users','Chưa có người dùng nào đăng nhập.')}</div></div>`;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>busy(b,'đang lưu…',async()=>{
    await api('/roles',{method:'POST',body:{email:b.dataset.e,role:b.dataset.r}});toast('Đã cập nhật quyền');route()}));
}

/* -------------------------------------------------------------- home */
/* Buổi đang chạy ở đầu trang chủ: vào thẳng hoặc kết thúc, khỏi lần qua vị trí -> ứng
   viên. Buổi "bị ngắt" là buổi server đã khởi động lại giữa chừng (Render free tự tắt
   khi rảnh): không nghe tiếp được, chỉ còn chấm phần transcript đã lưu hoặc xoá. */
function liveCard(ls){
  if(!ls.length)return'';
  const run=ls.filter(x=>x.running),dead=ls.filter(x=>!x.running);
  const row=x=>`<div class="live-row" data-sid="${x.id}">${av('✦'+x.candidate.name)}
    <div class="grow"><div class="t">${esc(x.candidate.name)} <span class="tag">${esc(x.source)}</span></div>
      <div class="m">${esc(x.position.title)} · ${x.running?`<span class="lclk" data-c="${x.clock}">${mmss(x.clock)}</span> · `:'bị ngắt khi server khởi động lại · '}${x.n_segments} câu${
        x.running&&x.audio===false?' · <span class="tag warn">chưa có âm thanh</span>':''}${
        x.running&&x.idle_s>60?` · <span class="tag warn" title="Extension hoặc mic đã tắt thu nhưng buổi chưa kết thúc">không có âm thanh ${Math.round(x.idle_s/60)} phút</span>`:''}</div></div>

    ${x.running?'':`<button class="sm sec" data-del="${x.id}">${I('trash','sm')} Xoá</button>`}</div>`;

    ${dead.length?`<details style="margin-top:12px"><summary class="xs mut">${dead.length} buổi bị ngắt</summary><div class="list" style="margin-top:8px">${dead.map(row).join('')}</div></details>`:''}</div>`;
}

  app.innerHTML=`<div class="ph"><div><h1>Vị trí đang tuyển</h1><div class="sub">Nghe cả hai bên · gợi ý câu hỏi khi được gọi · chấm và so sánh ứng viên</div></div></div>

      ||empty('briefcase','Chưa có vị trí nào. Tạo vị trí đầu tiên ở dưới - gõ tên, hoặc tải file JD để AI điền sẵn.')}</div>
    <div class="section row"><input id="nt" placeholder="Tên vị trí, vd: CFO, Senior Backend Engineer" style="flex:1;min-width:220px"><button id="np">${I('plus','sm')} Tạo vị trí</button>
      <button class="sec" id="npf" title="PDF, Word, ảnh chụp JD - AI điền tên vị trí, JD và yêu cầu">${I('upload','sm')} Tạo từ file JD</button></div>
  </div>`;
  const bindLive=()=>{
    $('lives').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=`#/s/${b.dataset.go}`});
    $('lives').querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{if(!confirm('Kết thúc buổi này và chấm điểm?'))return;
      busy(b,'đang chấm…',async()=>{const r=await api(`/sessions/${b.dataset.end}/end`,{method:'POST'});
        if(r.error)toast('Đã kết thúc buổi nhưng chấm điểm lỗi - bấm "Chấm điểm" để chấm lại. '+r.error,true);else toast('Đã kết thúc và chấm');
        location.hash=`#/s/${r.id}`})});
    $('lives').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Xoá buổi bị ngắt này? Không khôi phục được.'))return;
      try{await api(`/sessions/${b.dataset.del}`,{method:'DELETE'});refresh()}catch(e){toast(e.message,true)}});
  };
  const refresh=async()=>{try{const x=await api('/live-sessions');if($('lives')&&!$('lives').querySelector('button:disabled .spin')){$('lives').innerHTML=liveCard(x);bindLive()}}catch{}};
  bindLive();
  // đồng hồ chạy tại chỗ mỗi giây, danh sách hỏi lại server mỗi 10 giây
  const t0=Date.now();
  const tick=setInterval(()=>document.querySelectorAll('.lclk').forEach(el=>el.textContent=mmss(+el.dataset.c+(Date.now()-t0)/1000)),1000);
  const poll=setInterval(refresh,10000);
  teardown=()=>{clearInterval(tick);clearInterval(poll)};
  $('nt').onkeydown=e=>{if(e.key==='Enter')$('np').click()};
  $('np').onclick=()=>{const t=$('nt').value.trim();if(!t)return;busy('np','đang tạo…',async()=>{const p=await api('/positions',{method:'POST',body:{title:t}});location.hash=`#/p/${p.id}`})};
  $('npf').onclick=async()=>{const [f]=await pickFiles(ACC_DOC);if(!f)return;
    busy('npf','AI đang đọc JD…',async()=>{const r=await readDoc('jd',f);
      const nt=$('nt'),p=await api('/positions',{method:'POST',body:{title:(r.title||'').trim()||(nt?nt.value.trim():'')||baseName(f),jd:r.jd||'',requirements:r.requirements||''}});
      toast(r.via==='raw'?'AI lỗi - đã chép nguyên văn chữ trong file, nhớ xem lại':`Đã tạo vị trí ${p.title} từ JD`);

      if(['','#','#/'].includes(location.hash))location.hash=`#/p/${p.id}`})};
}

async function position(app,pid){

    <div class="row">${nEval>=2?`<a href="#/p/${pid}/compare"><button class="ok">${I('scale','sm')} So sánh ${nEval} ứng viên</button></a>`:`<span class="small mut">Cần ≥ 2 ứng viên đã chấm để so sánh (${nEval})</span>`}
    <button class="ghost" id="del" title="Xoá vị trí">${I('trash','sm')}</button></div></div>
  <div class="grid-side">
   <div class="card"><div class="card-h">${I('file')}<h2>Thông tin vị trí</h2></div>
    <label>Tên</label><input id="title" value="${esc(p.title)}">
    <div class="lrow"><label for="jd">Job description <span class="mut">- dán text, hoặc tải / thả file JD vào ô</span></label><button class="ghost sm" id="jdf" title="PDF, Word, ảnh chụp JD">${I('upload','sm')} Đọc từ file JD</button></div>
    <textarea id="jd" style="min-height:150px">${esc(p.jd)}</textarea>
    <label>Yêu cầu</label><textarea id="req">${esc(p.requirements)}</textarea>

    <details class="box"><summary>Nâng cao: persona trợ lý và từ chuyên ngành</summary>
     <label>Persona trợ lý <span class="mut">- để trống thì app tự viết khi tạo tiêu chí</span></label><textarea id="persona">${esc(p.persona)}</textarea>
     <label>Từ chuyên ngành cho STT <span class="mut">- mỗi dòng một từ/cụm, tối đa 100; app tự sinh khi tạo tiêu chí</span></label><textarea id="vocab" style="min-height:110px">${esc(p.vocab.join('\n'))}</textarea>
    </details>
    <div class="row" style="margin-top:16px"><button id="save">${I('check','sm')} Lưu</button><span id="bst" class="small mut"></span></div>
   </div>
   <div class="stack">
    <div class="card"><div class="card-h">${I('users')}<h2>Ứng viên</h2><span class="count" id="ccount"></span><span class="spacer"></span>
      <select id="csort" class="sm-sel" title="Sắp xếp"><option value="fit">Phù hợp nhất trước</option><option value="new">Thứ tự thêm</option></select></div>
     <div id="chint"></div><div class="list" id="clist"></div><div id="upl"></div>
     <div class="section row"><input id="cn" placeholder="Tên ứng viên" style="flex:1;min-width:140px"><button id="ca">${I('plus','sm')} Thêm</button>
      <button class="sec" id="caf" title="Chọn một hoặc nhiều file CV (PDF, Word, ảnh) - AI điền tên, CV và chấm độ phù hợp">${I('upload','sm')} Thêm từ file CV</button></div>
    </div>
    <div class="card" id="crit"></div>
   </div></div>`;
  const save=async()=>{await api(`/positions/${pid}`,{method:'PUT',body:{title:$('title').value,jd:$('jd').value,requirements:$('req').value,background:$('bg').value,persona:$('persona').value,vocab:$('vocab').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,100)}})};
  $('save').onclick=()=>busy('save','đang lưu…',async()=>{await save();toast('Đã lưu')});

  /* JD từ file: điền JD + yêu cầu (tên vị trí giữ nguyên, khác thì gợi ý), rồi lưu luôn. */
  const loadJd=f=>busy('jdf','AI đang đọc JD…',async()=>{
    if(($('jd').value.trim()||$('req').value.trim())&&!confirm('Thay JD và phần yêu cầu hiện tại bằng nội dung đọc từ file?'))return;
    $('bst').innerHTML='<span class="spin"></span> AI đang đọc file (thường 10-30 giây)…';
    try{const r=await readDoc('jd',f);
      // Rời trang trong lúc AI đọc: form không còn, vẫn lưu JD thẳng vào vị trí - khỏi mất công đọc lại.
      if(!alive){await api(`/positions/${pid}`,{method:'PUT',body:{jd:r.jd||'',requirements:r.requirements||''}});
        // Đã quay lại đúng vị trí này: trang mới mở trước khi JD được lưu nên form còn JD cũ - điền luôn,
        // không thì lần "Lưu" sau (hay nhập tiêu chí, vốn lưu form trước) ghi đè JD vừa đọc.
        if(location.hash===`#/p/${pid}`&&$('jd')){$('jd').value=r.jd||'';$('req').value=r.requirements||''}
        toast(`Đã đọc xong JD và lưu vào vị trí ${p.title}`);return}
      $('jd').value=r.jd||'';$('req').value=r.requirements||'';await save();
      const t=(r.title||'').trim();
      $('bst').innerHTML=t&&t.toLowerCase()!==$('title').value.trim().toLowerCase()?`Tên trong JD: <b>${esc(t)}</b> · <a href="#" id="uset">Dùng tên này</a>`:'';
      if($('uset'))$('uset').onclick=async e=>{e.preventDefault();$('title').value=t;$('bst').textContent='';await save();toast('Đã đổi tên vị trí')};
      toast(r.via==='raw'?'AI lỗi - đã chép nguyên văn chữ trong file, nhớ xem lại':'Đã điền JD từ file và lưu')}
    catch(e){if(alive)$('bst').textContent='';throw e}});
  $('jdf').onclick=async()=>{const [f]=await pickFiles(ACC_DOC);if(f)loadJd(f)};
  dropZone($('jd'),loadJd);

  /* ------ ứng viên: danh sách vẽ lại tại chỗ (ô nhập tên và tiến trình tải file giữ nguyên) */
  const fitKey=c=>c.evaluation?.match?.final??c.screening?.match??-1;
  const candRow=c=>{const s=c.screening||{},ev=c.evaluation;
    const cv=s.status==='running'?`<span class="tag"><span class="spin"></span> đang chấm CV</span>`
      :s.match!=null?`<span class="tag ${fitCls(s.match)}" title="Độ phù hợp sơ bộ từ CV${s.stale?' - CV/tiêu chí đã đổi, nên chấm lại':''}">CV ${s.match}%${s.stale?' *':''}</span>`
      :s.status==='error'?`<span class="tag err" title="${esc(s.error||'')}">chấm CV lỗi</span>`:c.has_cv?'':`<span class="tag">chưa có CV</span>`;
    const must=s.must&&s.must.not_met?`<span class="tag err" title="Không đạt ${s.must.not_met} yêu cầu bắt buộc (theo CV)">${I('x','sm')} ${s.must.not_met} bắt buộc</span>`:'';
    const pv=ev&&ev.match&&ev.match.final!=null?`<span class="tag ${fitCls(ev.match.final)}" title="Độ phù hợp sau phỏng vấn (CV + buổi phỏng vấn)">PV ${ev.match.final}%</span>`:'';
    return `<a class="item" href="#/c/${c.id}">${av(c.name)}<div style="min-width:0;flex:1"><div class="t">${esc(c.name)}</div>
      <div class="m row"><span>${c.n_sessions} buổi${ev?` · <b class="num">${ev.overall_score.toFixed(1)}</b>/5`:''}</span>${cv}${must}${pv}</div></div>
      <span class="go">${ev?rec(ev.recommendation):srec(s.recommendation)}${I('chev')}</span></a>`};
  const renderCands=()=>{const cs=[...p.candidates];if(($('csort').value||'fit')==='fit')cs.sort((a,b)=>fitKey(b)-fitKey(a));
    $('ccount').textContent=cs.length;$('psub').textContent=`${p.rubric.length} tiêu chí · ${cs.length} ứng viên`;
    $('csort').style.display=cs.length>1?'':'none';
    const need=p.rubric.length?cs.filter(c=>c.has_cv&&c.screening&&(c.screening.stale||['none','error'].includes(c.screening.status))).length:0;
    $('chint').innerHTML=need?`<div class="hint warn" style="margin-bottom:12px;align-items:center">${I('alert')}<div style="flex:1">${need} ứng viên chưa có kết quả sàng lọc theo tiêu chí và CV hiện tại.</div><button class="sm sec" id="rescr">${I('refresh','sm')} Chấm CV</button></div>`:'';
    if($('rescr'))$('rescr').onclick=()=>busy('rescr','đang bắt đầu…',async()=>{const r=await api(`/positions/${pid}/screen`,{method:'POST'});toast(`Đang chấm ${r.started} CV`);await refresh()});
    $('clist').innerHTML=cs.map(candRow).join('')||empty('users','Chưa có ứng viên. Thêm theo tên, hoặc tải file CV để AI điền sẵn và chấm độ phù hợp.')};
  $('csort').value=pref.get('csort')||'fit';
  $('csort').onchange=()=>{pref.set('csort',$('csort').value);renderCands()};
  /* alive = trang này còn đang hiện. Tải CV và polling chạy nền vài phút; rời trang giữa chừng
     thì chúng vẫn chạy xong ở server, nhưng tuyệt đối không vẽ vào trang khác. */
  let poll=null,alive=true,editing=false;
  /* Theo dõi việc chạy nền ở server: chấm CV, và AI tạo / nhập tiêu chí (criteria_job). Việc tiêu chí
     chạy ở server nên rời trang giữa chừng không mất - quay lại là trang tự theo dõi tiếp. */
  const jobRun=x=>x.criteria_job?.status==='running';
  const busyNow=x=>x.candidates.some(c=>c.screening?.status==='running')||jobRun(x);
  const watch=()=>{if(!alive||poll||!busyNow(p))return;
    // Server chậm hơn 3 giây thì không bắn chồng request: hai trả lời về lộn thứ tự có thể làm thẻ tiêu chí
    // quay lại "AI đang…" sau khi polling đã dừng, rồi kẹt ở đó.
    let inflight=false;
    poll=setInterval(async()=>{if(!alive){clearInterval(poll);poll=null;return}
      if(inflight)return;inflight=true;
      try{const q=await api(`/positions/${pid}`);if(!alive)return;
        const ended=jobRun(p)&&!jobRun(q),run=jobRun(q);
        if(ended){p=q;syncLeft();const j=q.criteria_job;
          toast(j?.status==='error'?`AI xử lý tiêu chí lỗi: ${j.error}`:'AI đã xong tiêu chí - HR xem và sửa nếu cần',j?.status==='error')}
        else{p.candidates=q.candidates;p.criteria_job=q.criteria_job}
        if(!busyNow(q)){clearInterval(poll);poll=null}
        renderCands();if((ended||run)&&!editing)renderCrit()}catch{}finally{inflight=false}},3000)};
  teardown=()=>{alive=false;if(poll)clearInterval(poll);poll=null};
  // Đang mở "Sửa tiêu chí" thì không vẽ lại card tiêu chí - mất hết phần HR đang gõ.
  const refresh=async()=>{const q=await api(`/positions/${pid}`);if(!alive)return;p=q;renderCands();if(!editing)renderCrit();watch()};
  /* Nhập tiêu chí / AI đề xuất có thể điền bối cảnh, persona, từ chuyên ngành ở server. Chép giá trị
     mới vào form - không chép thì bấm "Lưu" lần sau sẽ ghi đè bằng ô cũ - nhưng chỉ vào ô HR chưa sửa
     từ lần đồng bộ trước: AI chạy cả phút, HR có thể đang gõ dở. */
  const leftNow=()=>({bg:$('bg').value,persona:$('persona').value,vocab:$('vocab').value});
  let leftSeen=leftNow();
  const syncLeft=()=>{if(!$('bg'))return;const cur=leftNow(),srv={bg:p.background||'',persona:p.persona||'',vocab:(p.vocab||[]).join('\n')};
    for(const k in srv)if(cur[k]===leftSeen[k])$(k).value=srv[k];leftSeen=leftNow()};
  $('cn').onkeydown=e=>{if(e.key==='Enter')$('ca').click()};
  $('ca').onclick=()=>{const n=$('cn').value.trim();if(!n)return;busy('ca','đang tạo…',async()=>{const c=await api(`/positions/${pid}/candidates`,{method:'POST',body:{name:n}});location.hash=`#/c/${c.id}`})};
  /* Nhiều CV một lượt: mỗi file -> AI đọc -> tạo ứng viên -> server tự chấm độ phù hợp (chạy nền). */
  $('caf').onclick=async()=>{const fs=await pickFiles(ACC_DOC,true);if(!fs.length)return;
    // id hàng theo từng đợt: bấm đợt thứ hai khi đợt đầu chưa xong thì mỗi đợt vẫn ghi đúng hàng của mình
    const bid=Date.now().toString(36),row=k=>alive?$(`up${bid}_${k}`):null;
    $('upl').insertAdjacentHTML('beforeend',`<div class="uplist">${fs.map((f,i)=>`<div class="uprow" id="up${bid}_${i}"><span class="spin"></span><span class="nm" title="${esc(f.name)}">${esc(f.name)}</span><span class="st mut">đang chờ…</span></div>`).join('')}</div>`);
    let next=0,ok=0;
    const say=(k,t)=>{const el=row(k);if(el)el.querySelector('.st').textContent=t};
    const mark=(k,good,html)=>{const el=row(k);if(!el)return;const sp=el.querySelector('.spin');if(sp)sp.outerHTML=I(good?'check':'alert','sm');el.classList.add(good?'ok':'bad');el.querySelector('.st').innerHTML=html};
    const worker=async()=>{while(next<fs.length){const k=next++,f=fs[k];
      try{say(k,'AI đang đọc CV…');const r=await readDoc('cv',f);
        const name=(r.name||'').trim()||baseName(f);say(k,'đang tạo ứng viên…');
        const c=await api(`/positions/${pid}/candidates`,{method:'POST',body:{name,cv:r.cv||''}});ok++;
        mark(k,true,`<a href="#/c/${c.id}">${esc(name)}</a> · ${c.screening?.status==='running'?'đang chấm độ phù hợp…':p.rubric.length?'đã tạo':'đã tạo - tạo tiêu chí để chấm độ phù hợp'}${r.via==='raw'?' · AI lỗi, đã chép nguyên văn':''}`);
        if(alive){p.candidates.push({...c,has_cv:!!c.cv,n_sessions:0});renderCands();watch()}}
      catch(e){mark(k,false,esc(e.message))}}};
    await busy('caf','đang tải…',()=>Promise.all([worker(),worker()]));   // 2 file song song; nút khoá tới khi xong
    if(!alive)return;
    toast(`Đã thêm ${ok}/${fs.length} ứng viên`);await refresh();
    // File xong thì ứng viên đã nằm trong danh sách; chỉ giữ lại các file lỗi để biết mà tải lại.
    setTimeout(()=>{if(!alive||!$('upl'))return;$('upl').querySelectorAll('.uprow.ok').forEach(x=>x.remove());
      $('upl').querySelectorAll('.uplist').forEach(x=>{if(!x.querySelector('.uprow'))x.remove()})},4000)};

  /* ------ tiêu chí đánh giá: của HR (file / dán) hoặc AI đề xuất; HR sửa tay được */
  const reqList=(t,xs,ic)=>(xs||[]).length?`<h3>${t}</h3><ul class="req">${xs.map(x=>`<li>${I(ic,'sm')}<span>${esc(x)}</span></li>`).join('')}</ul>`:'';
  const pasteBox=()=>`<details class="box"><summary>Hoặc dán tiêu chí dạng text</summary>
    <textarea id="ctext" style="margin-top:10px" placeholder="vd:&#10;Kinh nghiệm 40% - 2+ năm C&amp;B full function, công ty trên 200 nhân viên&#10;Kỹ năng chuyên môn 40% - Excel, Luật Lao động, BHXH, thuế TNCN; test đạt 8/10&#10;Kỹ năng mềm 20% - giao tiếp rõ ràng, tư vấn&#10;Bắt buộc: cử nhân, tiếng Anh đọc viết. Cộng điểm: chứng chỉ C&amp;B"></textarea>
    <div class="row" style="margin-top:8px"><button class="sec sm" id="ctextgo">${I('spark','sm')} Chuyển thành tiêu chí</button></div></details>`;
  const hhmm=ts=>new Date(ts*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  const renderCrit=()=>{const rub=p.rubric||[],cr=p.criteria||{},pc=pctOf(rub),hr=cr.source==='hr',job=p.criteria_job,run=job?.status==='running';
    const src=hr?`<span class="tag ok src" title="${esc(cr.file?'Từ file '+cr.file:'HR đã chốt')}">${I('shield','sm')}<span class="ell">Theo HR${cr.file?' · '+esc(cr.file):''}</span></span>`:rub.length?`<span class="tag acc">${I('spark','sm')} AI đề xuất</span>`:'';
    const head=`<div class="card-h">${I('target')}<h2>Tiêu chí đánh giá</h2><span class="count">${rub.length}</span>${src}<span class="spacer"></span>${rub.length&&!run?`<button class="ghost sm" id="cedit">${I('pen','sm')} Sửa</button>`:''}</div>`;
    // Việc AI đang chạy ở server (hoặc vừa lỗi): hiện ngay đầu thẻ, kể cả khi HR rời trang rồi quay lại.
    const jobBox=run?`<div class="hint acc" style="margin-bottom:12px"><span class="spin"></span><div>${job.kind==='import'?`AI đang đọc tiêu chí của HR${job.file?` (${esc(job.file)})`:''}`:'AI đang đề xuất tiêu chí từ JD'} - bắt đầu lúc ${hhmm(job.started_at)}, thường 20-60 giây. Có thể chuyển sang việc khác, kết quả tự hiện ở đây.</div></div>`
      :job?.status==='error'?`<div class="hint warn" style="margin-bottom:12px">${I('alert')}<div>${job.kind==='import'?'Nhập tiêu chí của HR':'AI đề xuất tiêu chí'} lỗi lúc ${hhmm(job.started_at)}: ${esc(job.error||'')}</div></div>`:'';
    const acts=run?'':!rub.length?`<div class="row"><button id="cfile">${I('upload','sm')} Tải file tiêu chí của HR</button><button class="sec" id="cbuild">${I('spark','sm')} AI đề xuất từ JD</button></div>
      ${pasteBox()}<div id="cst" class="small mut" style="margin-top:8px"></div>`
      :`<div class="row"><button class="sec sm" id="cfile">${I('upload','sm')} ${hr?'Tải file tiêu chí khác':'Dùng tiêu chí của HR'}</button>
        ${hr?`<button class="ghost sm" id="cdrop">Bỏ tiêu chí HR, để AI đề xuất</button>`:`<button class="ghost sm" id="cbuild">${I('spark','sm')} AI đề xuất lại</button>`}</div>
       ${pasteBox()}<div id="cst" class="small mut" style="margin-top:8px"></div>`;
    $('crit').innerHTML=!rub.length?head+jobBox+(run?'':`<p class="small mut" style="margin:0 0 12px">HR đã có bộ tiêu chí (vd bảng Job Analysis có tỷ trọng) thì tải lên hoặc dán vào - AI giữ nguyên tiêu chí và tỷ trọng HR đặt, chỉ thêm dấu hiệu nhận biết và câu hỏi gợi mở. Chưa có thì để AI đề xuất từ JD.</p>`)+acts
    :head+jobBox+`<div class="wbar">${rub.map((c,i)=>`<i style="flex:${Math.max(pc[i],1)};--h:${hue(c.name)}" title="${esc(c.name)} · ${pc[i].toFixed(0)}%"></i>`).join('')}</div>
      ${rub.map((c,i)=>`<div class="comp"><div class="ch"><b>${esc(c.name)}</b><span class="tag acc">${pc[i].toFixed(0)}%</span></div>
        ${c.description?`<div class="small" style="margin-top:6px">${esc(c.description)}</div>`:''}
        ${(c.signals||[]).length?`<div class="xs mut" style="margin-top:6px">Dấu hiệu: ${c.signals.map(esc).join(' · ')}</div>`:''}
        ${(c.sample_questions||[]).length?`<details><summary>câu hỏi gợi mở</summary><ul class="ul small">${c.sample_questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details>`:''}</div>`).join('')}
      ${reqList('Yêu cầu bắt buộc',cr.must_have,'shield')}${reqList('Cộng điểm (nice to have)',cr.nice_to_have,'plus')}
      <div class="section">${hr?`<p class="xs mut" style="margin:0 0 10px">${I('shield','sm')} Tiêu chí do HR đưa ra - AI không đề xuất thêm hay thay đổi.</p>`:''}${acts}</div>`;
    const status=t=>{if($('cst'))$('cst').innerHTML=t?`<span class="spin"></span> ${t}`:''};
    // Server chỉ khởi động việc rồi trả về ngay; watch() theo dõi tới khi xong.
    const startJob=async(path,body,msg)=>{await save();status('đang gửi cho AI…');
      try{const r=await api(path,{method:'POST',...(body?{body}:{})});if(!alive)return;
        p.criteria_job=r.job;renderCrit();watch();toast(msg)}
      finally{status('')}};
    const importCrit=body=>startJob(`/positions/${pid}/criteria`,body,'AI đang đọc tiêu chí của HR - có thể chuyển sang việc khác, kết quả tự hiện ở trang này');
    if($('cfile'))$('cfile').onclick=async()=>{const [f]=await pickFiles(ACC_CRIT);if(!f)return;
      if(rub.length&&!confirm(`Thay ${rub.length} tiêu chí hiện tại bằng tiêu chí trong "${f.name}"?`))return;
      busy('cfile','đang gửi…',async()=>importCrit(await fileBody(f)))};
    if($('ctextgo'))$('ctextgo').onclick=()=>{const t=$('ctext').value.trim();if(!t)return toast('Dán nội dung tiêu chí trước',true);
      if(rub.length&&!confirm(`Thay ${rub.length} tiêu chí hiện tại bằng tiêu chí vừa dán?`))return;busy('ctextgo','đang gửi…',()=>importCrit({text:t}))};
    const build=(id,force)=>busy(id,'đang gửi…',()=>startJob(`/positions/${pid}/build${force?'?force=1':''}`,null,
      'AI đang đề xuất tiêu chí từ JD - có thể chuyển sang việc khác, kết quả tự hiện ở trang này'));
    if($('cbuild'))$('cbuild').onclick=()=>{if(!$('jd').value.trim()&&!$('req').value.trim())return toast('Điền hoặc tải JD trước, AI cần JD để đề xuất',true);build('cbuild',false)};
    if($('cdrop'))$('cdrop').onclick=()=>{if(confirm('Bỏ bộ tiêu chí HR và để AI đề xuất tiêu chí mới từ JD?'))build('cdrop',true)};
    if($('cedit'))$('cedit').onclick=critEdit};
  const critEdit=()=>{const rub=p.rubric||[],cr=p.criteria||{},pc=pctOf(rub);editing=true;
    // Ô tỷ trọng hiện % đã quy đổi: rubric cũ lưu 1-5, hiện nguyên số kèm chữ "%" là sai nghĩa.
    const row=(c,w)=>`<div class="comp ed"><div class="row" style="gap:8px"><input class="e-name" value="${esc(c.name||'')}" placeholder="Tên tiêu chí" style="flex:1;min-width:150px">
        <input class="e-w num" type="number" min="0" step="1" value="${w??0}" style="width:80px" title="Tỷ trọng"><span class="small mut">%</span>
        <button class="ghost sm icon e-del" title="Xoá tiêu chí">${I('trash','sm')}</button></div>
      <textarea class="e-desc" placeholder="Mô tả, yêu cầu cụ thể, ngưỡng đạt">${esc(c.description||'')}</textarea>
      <textarea class="e-sig" placeholder="Dấu hiệu nhận biết - mỗi dòng một ý">${esc((c.signals||[]).join('\n'))}</textarea>
      <textarea class="e-q" placeholder="Câu hỏi gợi mở - mỗi dòng một câu">${esc((c.sample_questions||[]).join('\n'))}</textarea></div>`;
    $('crit').innerHTML=`<div class="card-h">${I('pen')}<h2>Sửa tiêu chí</h2><span class="spacer"></span><span class="small mut" id="wsum"></span></div>
      <div id="erows">${rub.map((c,i)=>row(c,Math.round(pc[i]))).join('')}</div>
      <button class="ghost sm" id="eadd" style="margin-top:10px">${I('plus','sm')} Thêm tiêu chí</button>
      <label>Yêu cầu bắt buộc <span class="mut">- mỗi dòng một yêu cầu</span></label><textarea id="emust">${esc((cr.must_have||[]).join('\n'))}</textarea>
      <label>Cộng điểm (nice to have) <span class="mut">- mỗi dòng một yêu cầu</span></label><textarea id="enice">${esc((cr.nice_to_have||[]).join('\n'))}</textarea>
      <div class="row" style="margin-top:14px"><button id="esave">${I('check','sm')} Lưu tiêu chí</button><button class="ghost" id="ecancel">Huỷ</button></div>
      <p class="xs mut" style="margin:10px 0 0">Tổng khác 100 thì app tự quy về % theo tỷ lệ. Đổi tỷ trọng: độ phù hợp tính lại ngay, không phải chấm lại CV. Đổi tên, mô tả hay yêu cầu: nên bấm "Chấm CV" lại.</p>`;
    const sum=()=>{const t=[...document.querySelectorAll('#erows .e-w')].reduce((a,x)=>a+(+x.value||0),0);$('wsum').innerHTML=`Tổng tỷ trọng: <b class="${t===100?'':'err'}">${t}%</b>`};
    sum();$('erows').oninput=e=>{if(e.target.classList.contains('e-w'))sum()};
    $('erows').onclick=e=>{const b=e.target.closest('.e-del');if(b){b.closest('.comp').remove();sum()}};
    $('eadd').onclick=()=>{$('erows').insertAdjacentHTML('beforeend',row({},0));sum();$('erows').lastElementChild.querySelector('.e-name').focus()};
    $('ecancel').onclick=()=>{editing=false;renderCrit()};
    $('esave').onclick=()=>busy('esave','đang lưu…',async()=>{const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
      const rubric=[...document.querySelectorAll('#erows .comp')].map(el=>({name:el.querySelector('.e-name').value.trim(),weight:+el.querySelector('.e-w').value||0,
        description:el.querySelector('.e-desc').value.trim(),signals:lines(el.querySelector('.e-sig').value),sample_questions:lines(el.querySelector('.e-q').value)})).filter(c=>c.name);
      if(!rubric.length)throw new Error('Cần ít nhất một tiêu chí');
      await api(`/positions/${pid}`,{method:'PUT',body:{rubric,criteria:{...cr,source:'hr',must_have:lines($('emust').value),nice_to_have:lines($('enice').value)}}});
      editing=false;toast('Đã lưu tiêu chí');await refresh()})};
  renderCands();renderCrit();watch();
  $('del').onclick=async()=>{if(!confirm(`Xoá vị trí "${p.title}" và toàn bộ ứng viên, buổi phỏng vấn?`))return;await api(`/positions/${pid}`,{method:'DELETE'});location.hash='#/'};
}

/* --------------------------------------------------------- candidate */
async function candidate(app,cid){
  const nav=NAV,[c,h,vs]=await Promise.all([api(`/candidates/${cid}`),api('/health'),api('/voices').catch(()=>[])]);
  if(nav!==NAV)return;
  H=h;
  const lastHost=pref.get('host');
  app.innerHTML=`${crumb([['Trang chủ','#/'],[c.position.title,`#/p/${c.position.id}`],[c.name]])}
  <div class="ph"><div class="row">${av(c.name,'lg')}<div><h1>${esc(c.name)}</h1><div class="sub">Ứng viên vị trí ${esc(c.position.title)}</div></div></div>
    <button class="ghost" id="del" title="Xoá ứng viên">${I('trash','sm')}</button></div>
  <div class="grid-side">
   <div class="stack"><div class="card"><div class="card-h">${I('file')}<h2>Hồ sơ</h2></div>
