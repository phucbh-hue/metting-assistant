/* Độ phù hợp sơ bộ từ CV, TRƯỚC phỏng vấn. % tính bằng code từ điểm 1-5 từng tiêu chí
   (1 = 0%, 3 = 50%, 5 = 100%); tiêu chí CV không nói tới thì "chưa rõ", không kéo điểm xuống. */
function scrHTML(c){const s=c.screening||{},r=s.result,pos=c.position,rub=pos.rubric||[],pc=pctOf(rub);
  const head=`<div class="card-h">${I('target')}<h2>Độ phù hợp với tiêu chí</h2><span class="tag">sơ bộ từ CV</span><span class="spacer"></span>${
    (c.cv||'').trim()&&rub.length?`<button class="ghost sm" id="rescr" ${s.status==='running'?'disabled':''}>${I('refresh','sm')} Chấm lại</button>`:''}</div>`;
  if(!rub.length)return head+`<div class="hint">${I('alert')}<div>Vị trí chưa có tiêu chí đánh giá. <a href="#/p/${pos.id}">Tải tiêu chí của HR hoặc để AI đề xuất</a>, rồi app sẽ chấm độ phù hợp của CV.</div></div>`;
  if(!(c.cv||'').trim())return head+`<div class="hint">${I('file')}<div>Tải file CV hoặc dán CV vào ô bên trái - AI đối chiếu với ${rub.length} tiêu chí${(pos.criteria?.must_have||[]).length?' và các yêu cầu bắt buộc':''} của vị trí.</div></div>`;
  if(!r)return head+(s.status==='running'?`<p class="small mut" style="margin:0"><span class="spin"></span> AI đang đọc CV và đối chiếu với từng tiêu chí… (thường 30-60 giây)</p>`
    :s.status==='error'?`<div class="hint warn">${I('alert')}<div>Chấm CV lỗi: ${esc(s.error||'')}</div></div>`:`<p class="small mut" style="margin:0">Chưa chấm - bấm "Chấm lại".</p>`);
  const by=Object.fromEntries((r.criteria||[]).map(x=>[x.name,x])),le=c.latest_eval,after=le&&le.match&&le.match.final!=null;
  return head+(s.status==='running'?`<div class="hint acc" style="margin-bottom:12px"><span class="spin"></span><div>Đang chấm lại theo CV / tiêu chí mới…</div></div>`
    :s.status==='error'?`<div class="hint warn" style="margin-bottom:12px">${I('alert')}<div>Lần chấm lại vừa rồi lỗi (${esc(s.error||'')}) - đang hiện kết quả cũ.</div></div>`
    :s.stale?`<div class="hint warn" style="margin-bottom:12px">${I('alert')}<div>CV, ghi chú hoặc tiêu chí đã đổi sau lần chấm này - bấm "Chấm lại" để cập nhật.</div></div>`:'')+
  `<div class="row" style="gap:20px;align-items:center">
    <div class="score-ring" style="--p:${s.match??0}"><div><div><b>${s.match??'–'}${s.match!=null?'<small>%</small>':''}</b><br><span>phù hợp</span></div></div></div>
    <div style="flex:1;min-width:200px"><div class="row" style="gap:8px">${srec(r.recommendation)}<span class="xs mut">gợi ý của AI - HR quyết định</span></div>
     <p style="margin:8px 0 0;font-size:14.5px;line-height:1.55">${esc(r.summary)}</p>
     <div class="xs mut" style="margin-top:6px">${s.coverage!=null&&s.coverage<100?`Đánh giá được ${s.coverage}% tỷ trọng từ CV, phần còn lại cần hỏi khi phỏng vấn. `:''}${s.at?'Chấm lúc '+dt(s.at):''}</div>
     ${after?`<div class="row" style="margin-top:8px;gap:8px"><span class="tag ${fitCls(le.match.final)}">Sau phỏng vấn: ${le.match.final}%</span>${delta(s.match,le.match.final)}<a class="small" href="#/s/${le.session_id}">xem bản chấm ›</a></div>`:''}</div></div>
   <h3>Theo tiêu chí</h3>
   ${rub.map((cc,i)=>{const x=by[cc.name]||{score:0,assessment:'',evidence:[]};return `<div class="crow tight"><div><b>${esc(cc.name)}</b> <span class="xs mut">${pc[i].toFixed(0)}%</span>
     <div class="row" style="margin-top:6px;gap:8px"><div class="bar"><i style="width:${(x.score||0)*20}%"></i></div><b class="num small">${x.score?x.score+'/5':'chưa rõ'}</b></div></div>
     <div><div class="small">${esc(x.assessment)}</div>${(x.evidence||[]).length?`<details><summary>${x.evidence.length} trích từ CV</summary>${x.evidence.map(q=>`<blockquote>“${esc(q)}”</blockquote>`).join('')}</details>`:''}</div></div>`}).join('')}
   ${reqRows('Yêu cầu bắt buộc',r.must_have)}${reqRows('Cộng điểm',r.nice_to_have)}
   <div class="grid2" style="margin-top:4px"><div><h3>Điểm mạnh</h3>${liHTML(r.strengths)}<h3>CV chưa thể hiện</h3>${liHTML(r.gaps)}
     ${(r.red_flags||[]).length?`<h3 style="color:var(--err)">Điểm đáng ngờ</h3><div class="flag">${I('flag','sm')}<div>${r.red_flags.map(esc).join('<br>')}</div></div>`:''}</div>
    <div><h3>Nên hỏi khi phỏng vấn</h3>${liHTML(r.questions)}</div></div>`}

/* ------------------------------------------------------------- mic */
function downsample(buf,inRate){if(inRate===RATE)return buf;const ratio=inRate/RATE,out=new Float32Array(Math.round(buf.length/ratio));
  for(let i=0;i<out.length;i++){const s=i*ratio,a=Math.floor(s),b=Math.min(Math.ceil(s),buf.length-1);out[i]=buf[a]+(buf[b]-buf[a])*(s-a)}return out}
function toPCM16(f32){const o=new Int16Array(f32.length);for(let i=0;i<f32.length;i++){const s=Math.max(-1,Math.min(1,f32[i]));o[i]=s<0?s*0x8000:s*0x7fff}return o}
/* Cắt khoảng lặng đầu/cuối. Mỗi giây mẫu là một giây phải chờ lúc mở buổi khi phải lùi
   về mồi giọng cho Soniox (không có model so giọng). */
function trimSilence(pcm){const win=RATE/20;
  const loud=i=>{let s=0,n=0;for(let k=i;k<Math.min(i+win,pcm.length);k++,n++)s+=Math.abs(pcm[k]);return n&&s/n>500};
  let a=0,b=pcm.length;while(a<b&&!loud(a))a+=win;while(b>a&&!loud(Math.max(0,b-win)))b-=win;
  return pcm.subarray(Math.max(0,a-win*2),Math.min(pcm.length,b+win*2))}
function b64pcm(pcm){const u8=new Uint8Array(pcm.buffer,pcm.byteOffset,pcm.byteLength);let s='';
  for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function recordPrime(onTick){const parts=[];const mic=await openMic(x=>parts.push(x));const t0=Date.now();
  await new Promise(r=>{const iv=setInterval(()=>{const left=PRIME_SEC-(Date.now()-t0)/1000;onTick(Math.max(0,left));if(left<=0){clearInterval(iv);r()}},200)});
  mic.stop();const all=new Int16Array(parts.reduce((a,x)=>a+x.length,0));let o=0;for(const x of parts){all.set(x,o);o+=x.length}
  const cut=trimSilence(all);return{b64:b64pcm(cut),sec:cut.length/RATE}}
async function openMic(onChunk){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);const node=ctx.createScriptProcessor(4096,1,1);
  node.onaudioprocess=e=>onChunk(toPCM16(downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate)));
  src.connect(node);node.connect(ctx.destination);
  return{stop(){node.disconnect();src.disconnect();ctx.close();stream.getTracks().forEach(t=>t.stop())}};
}

/* Tên hiển thị của một câu. Nhận ra qua giọng đã lưu thì có tên; người lạ là ứng viên. */
function speakerName(seg,s){
  const people=(s.meta||{}).people||[];
  if(seg.role==='interviewer')return seg.who||(people.length?'Người phỏng vấn':'Tôi');
  if(seg.role==='candidate')return (s.candidate&&s.candidate.name)||'Ứng viên';
  return `Người ${seg.speaker}`;
}
function segInner(seg,s){
  const name=speakerName(seg,s);const host=((s.meta||{}).people||[]).find(p=>p.host);
  const crown=seg.role==='interviewer'&&host&&seg.who===host.name?`<span class="crown" title="Chủ phòng">${I('crown','sm')}</span>`:'';
  const fixed=seg.manual?`<span class="t" title="Vai câu này do người dùng sửa">${I('check','sm')} đã sửa</span>`:'';
  return `${av(seg.role==='candidate'?'✦'+name:name)}<div class="bd"><div class="who" title="Bấm để đổi vai câu này">${crown}${esc(name)} <span class="t">${mmss(seg.t)}</span>${fixed}</div><div class="tx">${esc(seg.text)}</div></div>`;
}
/* Đổi vai MỘT câu (người phỏng vấn <-> ứng viên). Không đổi theo nhãn Soniox: nhãn hay tráo giữa buổi,
   đổi theo nhãn là đè lên cả những câu app đã gán đúng. Buổi đang chạy thì app vẫn tự gán các câu khác. */
async function flipSeg(sid,list,seg){
  const i=list.indexOf(seg);if(i<0)return null;
  const role=seg.role==='interviewer'?'candidate':'interviewer';
  try{const r=await api(`/sessions/${sid}/segments/${i}/role`,{method:'POST',body:{role,t:seg.t}});
    seg.role=r.role;seg.manual=true;if(r.who)seg.who=r.who;else delete seg.who;return r}
  catch(e){toast(e.message,true);return null}
}

/* ---------------------------------------------------------- session */
async function session(app,sid){
  const nav=NAV;
  let s=await api(`/sessions/${sid}`);
  if(nav!==NAV)return;                // trang buổi live mở mic và websocket: tuyệt đối không mở khi đã rời
  if(!s.live) return showEnded(app,s);
  const wsBase=(location.protocol==='https:'?'wss://':'ws://')+location.host+IV_BASE;
  const _wsq=()=>`?token=${encodeURIComponent(_tok())}`;
  const people=(s.meta||{}).people||[];
  app.innerHTML=`<div class="live"><div class="live-in">
    <span class="rec${s.source==='mic'?' prep':''}" id="rec"><span class="dot${s.source==='mic'?'':' on'}" id="dot"></span><span id="recT">${s.source==='mic'?'CHUẨN BỊ':'ĐANG GHI'}</span></span>
    <div><div class="row" style="gap:8px"><b>${esc(s.candidate.name)}</b><span class="tag">${esc(s.source)}</span><span class="tag">${esc((s.meta||{}).engine||'soniox')}</span></div>
      <div class="xs mut">${crumb([['Trang chủ','#/'],[s.position.title,`#/p/${s.position.id}`],[s.candidate.name,`#/c/${s.candidate.id}`],['buổi #'+sid]]).replace('class="crumb"','class="crumb" style="margin:2px 0 0"')}</div></div>
    <span class="clock" id="clk">0:00</span><span class="small mut" id="st"></span>
    <span class="spacer"></span>
    <button class="sec" id="swap" title="Nếu app gán nhầm ai là người phỏng vấn">${I('swap','sm')} Đổi vai</button>
    <button class="danger" id="end">${I('stop','sm')} Kết thúc &amp; chấm</button>
  </div></div>
  <div class="sess">
   <div class="panel">
    <div class="panel-h"><div id="spk" class="spkbar"></div></div>
    <div class="hint acc" id="prep" style="display:none;margin:12px 16px 0"><span class="spin"></span><div id="prepT"></div></div>
    <div id="tr"></div><div class="interim" id="interim"></div>
   </div>
   <div class="side">
    <button class="big hero" id="ask">${I('brain')} Hỏi gì tiếp?</button>
    <p class="xs mut" style="margin:8px 4px 0">Hoặc nói câu gọi trợ lý (vd "anh nghĩ sao") - chỉ nhận khi người nói là chủ phòng.</p>
    ${cvCheckHTML(s.screening)}
    <div id="assists"></div>
   </div></div>`;
  const tr=$('tr'),interim=$('interim'),assists=$('assists');let draftEl=null;
  const ASK=`${I('brain')} Hỏi gì tiếp?`;
  // partial/interim theo TỪNG luồng: extension có mic + tab cùng bắn, dùng chung một
  // chỗ thì dòng đang nói nhảy qua lại giữa hai người mỗi vài trăm mili giây.
  let roles=s.roles||{},segEls=new Map(),partialEls={},interims={},primeSpk=null,voiceMode=!!(s.meta||{}).voice,voiceWait=false;
  const bindWho=(el,seg)=>{const w=el.querySelector('.who');if(w)w.onclick=async()=>{
    if(await flipSeg(sid,s.transcript,seg)){el.className='seg '+(seg.role||'unknown');el.innerHTML=segInner(seg,s);bindWho(el,seg)}}};
  const render=()=>{tr.innerHTML='';segEls.clear();partialEls={};for(const seg of s.transcript)addSeg(seg);renderSpk();
    if(!s.transcript.length)tr.innerHTML=empty('mic','Đang nghe… lời nói sẽ hiện ở đây.')};
  // Segment đã chốt chen TRƯỚC các dòng đang nói dở, để dòng dở luôn nằm cuối.
  const addSeg=seg=>{const e=tr.querySelector('.empty');if(e)e.remove();
    const d=document.createElement('div');d.className='seg '+(seg.role||'unknown');d.innerHTML=segInner(seg,s);bindWho(d,seg);
    tr.insertBefore(d,tr.querySelector('.seg.partial'));segEls.set(seg,d);scroll()};
  // Mic phòng (diarize): hiện người nói, bấm nhãn để đổi vai. Có giọng đã lưu thì app so
  // giọng từng câu để gọi TÊN; sửa tay thì server khoá, thôi tự đổi.
  // Extension thì vai theo nguồn vật lý nên chỉ cần một dòng chú giải.
  const DIAR=s.source==='mic'||s.source==='replay';
  const renderSpk=()=>{const el=$('spk');
    if(!DIAR&&!(s.source==='ext'&&people.length)){el.innerHTML=s.source==='ext'?`<span class="person">${av('Tôi')}Tôi = mic của bạn</span><span class="person">${av('✦'+s.candidate.name)}Ứng viên = tiếng trong tab Meet</span>`:'<span class="xs mut">Vai theo tên người tham dự</span>';return}
    const who=people.length?people.map(p=>`<span class="person" title="${p.host?'Chủ phòng':'Người phỏng vấn'}">${av(p.name)}${esc(p.name)}${p.host?' '+I('crown','sm'):''}</span>`).join('')
      +`<span class="person">${av('✦'+s.candidate.name)}${esc(s.candidate.name)}</span>`:'';
    const labels=[...new Set([...Object.keys(roles),...s.transcript.map(x=>String(x.speaker))])].filter(Boolean).sort();
    const chips=labels.map(l=>`<button class="chip ${roles[l]||'unknown'}" data-spk="${esc(l)}" title="${l===primeSpk?'Nhận ra qua giọng mẫu · ':''}Bấm để đổi vai">Nhãn ${esc(l)} · ${roles[l]?ROLE[roles[l]]:'chưa rõ'}</button>`).join('');
    const note=voiceMode?`${I('check','sm')} So giọng + đọc nội dung từng câu${people.length?' - gọi đúng tên':''}`:'Tự nhận vai theo nội dung từng câu';
    el.innerHTML=`${who}<span class="xs mut" style="margin-left:${who?'8px':'0'}">${note}</span>${chips?`<details style="margin-left:auto"><summary>Sửa nhãn tay</summary><div class="spkbar" style="margin-top:6px">${chips}<span class="xs mut">đổi cả nhãn là app thôi tự đổi vai - sai vài câu thì bấm tên ở từng câu</span></div></details>`:''}`;
    el.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>assignRole(sid,roles,b.dataset.spk));
  };
  const scroll=()=>{tr.scrollTop=tr.scrollHeight};
  render();
  let t0=Date.now()-(s.clock||0)*1000;const clk=setInterval(()=>$('clk').textContent=mmss((Date.now()-t0)/1000),500);

  // events
  const ews=new WebSocket(`${wsBase}/ws/session/${sid}/events`+_wsq());
  ews.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='snapshot'){s.transcript=m.segments;roles=m.roles;render()}
    else if(m.type==='interim'){interims[m.stream||'_']=m.text||'';interim.textContent=Object.values(interims).filter(Boolean).map(x=>'… '+x).join('   ')}
    else if(m.type==='partial'){const k=m.stream||'_';let el=partialEls[k];if(!el){el=partialEls[k]=document.createElement('div');tr.appendChild(el);const x=tr.querySelector('.empty');if(x)x.remove()}el.dataset.spk=m.segment.speaker;el.className='seg partial '+(m.segment.role||'unknown');el.innerHTML=segInner(m.segment,s);scroll()}
    else if(m.type==='final'){const k=m.stream||Object.keys(partialEls).find(x=>partialEls[x].dataset.spk===String(m.segment.speaker))||'_';if(partialEls[k]){partialEls[k].remove();delete partialEls[k]}interims[k]='';interim.textContent=Object.values(interims).filter(Boolean).map(x=>'… '+x).join('   ');if(m.roles)roles=m.roles;s.transcript.push(m.segment);addSeg(m.segment);if(DIAR)renderSpk()}
    else if(m.type==='roles'){roles=m.roles;s.transcript=m.segments;if(m.prime)primeSpk=Object.keys(m.roles).find(k=>m.roles[k]==='interviewer')||null;render();toast(m.auto?(m.note||'App tự nhận vai'):'Đã đổi vai')}
    else if(m.type==='prime'){if(voiceWait){voiceWait=false;$('prep').style.display='none'}if(!m.ok){voiceMode=false;toast('Không nghe rõ giọng mẫu - app sẽ tự nhận vai theo nội dung',true)}
      else if(m.mode==='voice'){voiceMode=true;renderSpk();toast(people.length?`So giọng từng câu: ${(m.people||[]).join(', ')}`:'Đã có giọng mẫu - app so giọng từng câu')}}
    else if(m.type==='seg_role'){const seg=(s.transcript[m.i]&&s.transcript[m.i].t===m.t)?s.transcript[m.i]:s.transcript.find(x=>x.t===m.t);
      if(seg){seg.role=m.role;if(m.who)seg.who=m.who;else delete seg.who;const el=segEls.get(seg);if(el){el.className='seg '+(m.role||'unknown');el.innerHTML=segInner(seg,s);bindWho(el,seg)}}}
    else if(m.type==='assist_pending'){$('ask').disabled=true;$('ask').innerHTML='<span class="spin"></span> đang nghĩ…';draftEl=null}
    else if(m.type==='assist_draft'){if(draftEl)draftEl.remove();const d=document.createElement('div');d.innerHTML=assistHTML(m,true);draftEl=d.firstElementChild;assists.prepend(draftEl);$('ask').innerHTML='<span class="spin"></span> đang viết…'}
    else if(m.type==='assist'){$('ask').disabled=false;$('ask').innerHTML=ASK;if(draftEl){draftEl.remove();draftEl=null}assists.insertAdjacentHTML('afterbegin',assistHTML(m));if(m.trigger==='voice')toast('Trợ lý nghe thấy bạn gọi')}
    else if(m.type==='preparing'){$('prep').style.display='';$('prepT').textContent=m.text;$('st').textContent=m.text}
    else if(m.type==='ready'){if(!voiceWait)$('prep').style.display='none'}
    else if(m.type==='voice_wait'){voiceWait=true;$('prep').style.display='';$('prepT').textContent=m.text}
    else if(m.type==='stream'){toast(m.text||'Đã nối lại luồng')}
    else if(m.type==='participant'){toast(`${m.name} vào cuộc họp → ${ROLE[m.role]}`)}
    else if(m.type==='replay'){$('st').textContent=m.state==='start'?`replay ${mmss(m.seconds)} audio`:'replay xong - bấm Kết thúc'}
    else if(m.type==='error'){toast(m.text,true);$('ask').disabled=false;$('ask').innerHTML=ASK}
    else if(m.type==='ending'){$('end').disabled=true;$('end').innerHTML='<span class="spin"></span> đang chấm…';$('ask').disabled=true;
      try{mic&&mic.stop()}catch{}try{aws&&aws.readyState===1&&aws.send('stop')}catch{}mic=null;
      $('dot').classList.remove('on');$('rec').classList.remove('prep');$('recT').textContent='ĐÃ DỪNG';$('prep').style.display='none';
      $('st').textContent='Đã dừng - đang chấm điểm…'}
    else if(m.type==='ended'){cleanup();if(m.error)toast(m.error,true);showEnded(app,{...s,live:false,status:'ended',evaluation:m.evaluation})}};
  ews.onclose=()=>{const d=$('dot');if(d)d.classList.remove('on')};   // rời trang thì phần tử đã mất

  // mic
  let mic=null,aws=null;
  if(s.source==='mic'){
    // Có model: so giọng, mở mic ngay. Không có: server nạp giọng mẫu cho Soniox rồi mới báo "ready".
    if((s.meta||{}).prime_s||people.length)$('st').textContent=s.meta.voice?'đang chuẩn bị so giọng…':`đang nạp giọng mẫu (~${Math.ceil((s.meta.prime_s||0)+1)}s)…`;
    aws=new WebSocket(`${wsBase}/ws/session/${sid}/audio`+_wsq());aws.binaryType='arraybuffer';
    aws.onmessage=async e=>{if(JSON.parse(e.data).type!=='ready')return;
      try{mic=await openMic(pcm=>{if(aws.readyState===1)aws.send(pcm.buffer)});$('st').textContent='mic đang thu';
        $('prep').style.display='none';$('rec').classList.remove('prep');$('dot').classList.add('on');$('recT').textContent='ĐANG GHI'}
      catch(err){toast('Không mở được mic: '+err.message+'. Cần https và cho phép mic.',true)}};
    aws.onclose=()=>{$('st').textContent='mic ngắt'};
  }
  const cleanup=()=>{clearInterval(clk);try{mic&&mic.stop()}catch{}try{aws&&aws.readyState===1&&aws.send('stop')}catch{}try{aws&&aws.close()}catch{}try{ews.close()}catch{}};
  teardown=cleanup;

  $('ask').onclick=()=>busy('ask','đang nghĩ…',()=>api(`/sessions/${sid}/assist`,{method:'POST',body:{trigger:'button'}}));
  $('swap').onclick=()=>api(`/sessions/${sid}/roles`,{method:'POST',body:{swap:true}}).catch(e=>toast(e.message,true));
  /* Thường sự kiện 'ended' qua websocket chuyển trang trước khi /end trả về; websocket đứt thì
     tự chuyển ở đây. $('end') mất nghĩa là trang đã được thay - đừng đụng vào nữa. */
  $('end').onclick=async()=>{if(!confirm('Kết thúc buổi và chấm điểm?'))return;$('end').disabled=true;$('end').innerHTML='<span class="spin"></span> đang chấm…';
    try{mic&&mic.stop();aws&&aws.readyState===1&&aws.send('stop');const r=await api(`/sessions/${sid}/end`,{method:'POST'});
      if($('end')){cleanup();if(r.error)toast(r.error,true);showEnded(app,{...s,live:false,status:'ended',evaluation:r.evaluation})}}
    catch(e){if(!$('end'))return;toast(e.message,true);$('end').disabled=false;$('end').innerHTML=`${I('stop','sm')} Kết thúc &amp; chấm`}};
}

/* Trong buổi: những gì bản sàng lọc CV còn chưa chắc - yêu cầu bắt buộc chưa đạt/chưa rõ và
   câu nên hỏi để kiểm chứng. Sau buổi, "Kết thúc & chấm" đo lại chính những điểm này. */
function cvCheckHTML(sb){if(!sb||(!sb.requirements.length&&!sb.questions.length))return'';
  const n=sb.requirements.length+sb.questions.length;
  return `<details class="box" style="background:var(--surface)"><summary>${I('target','sm')} Cần kiểm chứng từ CV (${n})${sb.match!=null?` · CV phù hợp ${sb.match}%`:''}</summary>
    ${sb.requirements.length?`<div class="reqs" style="margin-top:10px">${sb.requirements.map(x=>`<div class="rq"><span class="tags">${reqTag(x.status)}</span><div style="min-width:0"><div class="small">${esc(x.requirement)}</div>${x.note?`<div class="xs mut">${esc(x.note)}</div>`:''}</div></div>`).join('')}</div>`:''}
    ${sb.questions.length?`<h3>Nên hỏi</h3><ul class="ul small">${sb.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}</details>`}

const MNAME=k=>({'gpt-5.5':'GPT-5.5','gpt-5.4':'GPT-5.4','vertex_ai/claude-sonnet-5':'Sonnet 5','vertex_ai/claude-opus-5@default':'Opus 5','claude-fable-5':'Fable 5','openrouter/deepseek/deepseek-v4-pro-0813':'DeepSeek','gemini-direct':'Gemini','claude-sonnet-5':'Claude Sonnet 5','claude-opus-5':'Claude Opus 5'})[k]||k;
function assistHTML(m,draft){const r=m.response,pn=r.panel;
  const meta=draft?`<span class="tag warn"><span class="spin"></span>${esc(MNAME(m.from))} · đang viết…</span>`
    :pn&&pn.models?`<span class="tag" title="${esc(Object.entries(pn.models).map(([k,v])=>k+': '+(v.ok?v.seconds+'s':'lỗi')).join(' · '))}">${Object.entries(pn.models).filter(([k,v])=>v.ok).map(([k])=>MNAME(k)).join(' + ')}${pn.synth&&pn.synth_ok!==false?' → '+MNAME(pn.synth):''}${pn.seconds?' · '+pn.seconds+'s':''}</span>`:'';
  return `<div class="assist${draft?' draft':''}"><div class="a-h"><span class="tag ${m.trigger==='voice'?'acc':''}">${I(m.trigger==='voice'?'mic':'hand','sm')} ${m.trigger==='voice'?'gọi bằng lời':'nút'} · ${mmss(m.t)}</span>${meta}</div>
   ${(r.follow_ups||[]).map(q=>`<div class="q"><span class="kind">${esc(q.kind)} · ${esc(q.competency)}${q.source?' · '+esc(MNAME(q.source)):''}</span><div class="qt">${esc(q.question)}</div>${q.why?`<div class="why">${esc(q.why)}</div>`:''}${q.based_on&&q.based_on!=='(chưa đề cập)'?`<div class="qb">“${esc(q.based_on)}”</div>`:''}</div>`).join('')}
   ${r.red_flags?.length?`<div class="flag">${I('flag','sm')}<div>${r.red_flags.map(esc).join('<br>')}</div></div>`:''}
   ${r.last_answer_summary||r.gaps?.length||r.not_yet_covered?.length?`<div class="a-sum">${r.last_answer_summary?`<b>Vừa nói:</b> ${esc(r.last_answer_summary)}`:''}
     ${r.gaps?.length?`<div class="xs mut" style="margin-top:6px">Chưa rõ: ${r.gaps.map(esc).join(' · ')}</div>`:''}
     ${r.not_yet_covered?.length?`<div class="xs mut" style="margin-top:4px">Chưa chạm: ${r.not_yet_covered.map(esc).join(', ')}</div>`:''}</div>`:''}</div>`}

/* Bấm một lần là đổi vai theo vòng Tôi -> Ứng viên -> chưa rõ. Bản cũ dùng prompt()
   bắt gõ 1/2/0 - chậm và chặn cả trang đúng lúc đang phỏng vấn. */
async function assignRole(sid,roles,spk){
  const order=['interviewer','candidate',undefined];
  const nx=order[(order.indexOf(roles[spk])+1)%order.length];
  const next={...roles};if(nx)next[spk]=nx;else delete next[spk];
  try{await api(`/sessions/${sid}/roles`,{method:'POST',body:{roles:next}})}catch(e){toast(e.message,true)}
}
/* -------------------------------------------------------- evaluation */
async function showEnded(app,s,nav=NAV){
  if(!s.assists) s=await api(`/sessions/${s.id}`);
  if(nav!==NAV)return;
  const ev=s.evaluation;
  app.innerHTML=`${crumb([['Trang chủ','#/'],[s.position.title,`#/p/${s.position.id}`],[s.candidate.name,`#/c/${s.candidate.id}`],['buổi #'+s.id]])}
  <div class="ph"><div class="row">${av('✦'+s.candidate.name,'lg')}<div><h1>${esc(s.candidate.name)}</h1><div class="sub">${dt(s.started_at)} · ${s.transcript.length} lượt nói · ${esc(s.source)}</div></div></div>
   <div class="row"><button class="sec" id="reeval">${I('refresh','sm')} ${ev?'Chấm lại':'Chấm điểm'}</button><button class="sec" id="swap">${I('swap','sm')} Đổi vai</button><button class="ghost" id="del" title="Xoá buổi">${I('trash','sm')}</button></div></div>
  <div id="evbox">${ev?evalHTML(ev,s.position):`<div class="card">${empty('spark','Chưa có đánh giá. Bấm "Chấm điểm" để AI đánh giá theo tiêu chí, đối chiếu cả CV lẫn buổi phỏng vấn.')}</div>`}</div>
  <div class="grid2" style="margin-top:18px">
   <div class="card"><div class="card-h">${I('mic')}<h2>Transcript</h2><span class="count">${s.transcript.length}</span></div><p class="xs mut" style="margin:-6px 0 12px">Câu nào sai vai thì bấm vào tên người nói của câu đó để đổi, rồi "Chấm lại".</p>
    <div id="trEnd" style="max-height:640px;overflow:auto;padding-right:4px">${s.transcript.map((seg,i)=>`<div class="seg ${seg.role||'unknown'}" data-i="${i}">${segInner(seg,s)}</div>`).join('')||empty('mic','Transcript trống.')}</div></div>
   <div class="card"><div class="card-h">${I('brain')}<h2>Trợ lý đã gợi ý</h2><span class="count">${s.assists.length}</span></div>${s.assists.map(a=>assistHTML(a)).join('')||empty('brain','Không gọi trợ lý lần nào.')}</div>
  </div>`;
  // Một handler cho cả danh sách: câu vừa đổi được vẽ lại, handler gắn trên phần tử cũ sẽ mất.
  $('trEnd').onclick=async e=>{const w=e.target.closest('.who'),d=w&&w.closest('.seg[data-i]');if(!d)return;
    const seg=s.transcript[+d.dataset.i];if(!await flipSeg(s.id,s.transcript,seg))return;
    d.className='seg '+(seg.role||'unknown');d.innerHTML=segInner(seg,s);
    toast(ev?'Đã đổi vai câu này - bấm "Chấm lại" để bản đánh giá theo vai mới':'Đã đổi vai câu này')};
  $('reeval').onclick=async()=>{$('reeval').disabled=true;$('reeval').innerHTML='<span class="spin"></span> đang chấm…';try{const e=await api(`/sessions/${s.id}/evaluate`,{method:'POST'});$('evbox').innerHTML=evalHTML(e,s.position)}catch(e){toast(e.message,true)}$('reeval').disabled=false;$('reeval').innerHTML=`${I('refresh','sm')} Chấm lại`};
  $('swap').onclick=async()=>{await api(`/sessions/${s.id}/roles`,{method:'POST',body:{swap:true}});route()};
  $('del').onclick=async()=>{if(!confirm('Xoá buổi này?'))return;await api(`/sessions/${s.id}`,{method:'DELETE'});location.hash=`#/c/${s.candidate.id}`};
}
/* Bản chấm sau buổi = đo LẠI từng tiêu chí bằng CV + phỏng vấn. Có bản chụp sàng lọc CV
   lúc chấm (match.cv) thì hiện trước/sau: CV nói gì, phỏng vấn xác nhận / nâng / hạ ra sao. */
function evalHTML(ev,pos){
  const m=ev.match||{},cv=m.cv,rub=(pos&&pos.rubric)||[],pc=pctOf(rub);
  const wOf=n=>{const i=rub.findIndex(x=>x.name===n);return i<0?'':` <span class="xs mut">${pc[i].toFixed(0)}%</span>`};
  return `<div class="card"><div class="row" style="gap:22px;align-items:center">
    <div class="score-ring" style="--p:${Math.max(0,Math.min(100,ev.overall_score*20))}"><div><div><b>${ev.overall_score.toFixed(1)}</b><br><span>trên 5</span></div></div></div>
    <div style="flex:1;min-width:240px"><div class="row">${rec(ev.recommendation)}</div><p style="margin:10px 0 0;font-size:17px;font-weight:600;line-height:1.45">${esc(ev.headline)}</p>
     ${m.final!=null?`<div class="row" style="margin-top:10px;gap:8px"><span class="tag ${fitCls(m.final)}">${I('target','sm')} Phù hợp với tiêu chí: ${m.final}%</span>${
       cv&&cv.match!=null?`<span class="small mut">CV trước buổi: ${cv.match}%</span>${delta(cv.match,m.final)}`:''}${m.coverage!=null&&m.coverage<100?`<span class="xs mut">· chấm được ${m.coverage}% tỷ trọng</span>`:''}</div>`:''}</div></div>
   <h3>Theo tiêu chí${cv?' - đối chiếu CV':''}</h3>
   ${ev.competencies.map(c=>{const b=cv&&cv.scores?cv.scores[c.name]:undefined;return `<div class="crow"><div><b>${esc(c.name)}</b>${wOf(c.name)}
     <div class="row" style="margin-top:8px;gap:10px"><div class="bar"><i style="width:${c.score*20}%"></i></div><b class="num">${c.score||'–'}</b></div>
     ${b!==undefined?`<div class="xs mut" style="margin-top:6px">CV: ${b?b+'/5':'chưa rõ'} → phỏng vấn: ${c.score?c.score+'/5':'chưa rõ'} ${b&&c.score?delta(b,c.score):''}</div>`:''}</div>
     <div><div class="small">${esc(c.assessment)}</div>${c.cv_check?`<div class="cvchk">${I('file','sm')}<div>${esc(c.cv_check)}</div></div>`:''}
      ${(c.evidence||[]).length?`<details><summary>${c.evidence.length} trích dẫn làm bằng chứng</summary>${c.evidence.map(q=>`<blockquote>“${esc(q)}”</blockquote>`).join('')}</details>`:''}</div></div>`}).join('')}
   ${reqRows(`Yêu cầu bắt buộc${cv?' (CV → sau phỏng vấn)':''}`,ev.must_have,cv&&cv.must_have)}${reqRows('Cộng điểm',ev.nice_to_have)}
   <div class="grid2" style="margin-top:6px">
    <div><h3>Điểm mạnh</h3>${liHTML(ev.strengths)}<h3>Lo ngại</h3>${liHTML(ev.concerns)}
      ${ev.red_flags.length?`<h3 style="color:var(--err)">Red flags</h3><div class="flag">${I('flag','sm')}<div>${ev.red_flags.map(esc).join('<br>')}</div></div>`:''}</div>
    <div><h3>Nên hỏi ở vòng sau</h3>${liHTML(ev.unanswered)}<h3>Góp ý cho người phỏng vấn</h3><p class="small" style="margin:0">${esc(ev.interviewer_feedback)}</p></div></div></div>`}

/* ----------------------------------------------------------- compare */
async function compare(app,pid,refresh){
  const nav=NAV;
  app.innerHTML='<div class="card"><p><span class="spin"></span> Đang tổng hợp nhận định…</p></div>';
  const c=await api(`/positions/${pid}/compare${refresh?'?refresh=1':''}`);
  if(nav!==NAV)return;                // tổng hợp mất cả chục giây: rời trang rồi thì đừng đè lên trang mới
  const n=c.narrative,names=c.candidates;
  const col=v=>!v?'':v>=4?'background:var(--ok-soft);color:var(--ok)':v<=2?'background:var(--err-soft);color:var(--err)':'';   // 0 = chưa đủ dữ liệu, không tô đỏ
  app.innerHTML=`${crumb([['Trang chủ','#/'],[c.position.title,`#/p/${pid}`],['So sánh']])}
  <div class="ph"><div><h1>So sánh ứng viên</h1><div class="sub">${esc(c.position.title)} · ${names.length} ứng viên đã chấm</div></div><button class="sec" id="rf">${I('refresh','sm')} Viết lại nhận định</button></div>
  <div class="card" style="padding:0;overflow:auto"><table><tr><th>Tiêu chí</th>${names.map(x=>`<th style="text-align:center">${esc(x)}</th>`).join('')}</tr>
   ${c.matrix.map(r=>`<tr><td>${esc(r.competency)}</td>${names.map(x=>`<td class="sc" style="${col(r.scores[x])}">${r.scores[x]||'–'}</td>`).join('')}</tr>`).join('')}
   <tr><td><b>Tổng (có trọng số)</b></td>${names.map(x=>`<td class="sc" style="font-size:18px">${c.overall[x].score?.toFixed(1)??'–'}<div style="margin-top:6px">${rec(c.overall[x].recommendation)}</div></td>`).join('')}</tr>
   ${names.some(x=>c.overall[x].match!=null)?`<tr><td><b>Phù hợp với tiêu chí</b><div class="xs mut">CV trước buổi → sau phỏng vấn</div></td>${names.map(x=>{const o=c.overall[x];
     return `<td class="sc">${o.match!=null?`<span class="tag ${fitCls(o.match)}">${o.match}%</span>`:'–'}${o.cv_match!=null?`<div class="xs mut" style="margin-top:6px;font-weight:500">CV ${o.cv_match}% ${delta(o.cv_match,o.match)}</div>`:''}</td>`}).join('')}</tr>`:''}
   ${names.some(x=>(c.overall[x].must_open||[]).length)?`<tr><td><b>Yêu cầu bắt buộc</b><div class="xs mut">chưa đạt đủ sau phỏng vấn</div></td>${names.map(x=>{const o=c.overall[x].must_open||[];
     const st={not_met:['x','err','không đạt'],partial:['minus','','một phần'],unknown:['help','mut','chưa rõ']};
     // Bản chấm không kiểm yêu cầu nào (chấm trước khi có danh sách, hoặc bản chấm cũ) KHÔNG phải "đạt hết".
     if(!c.overall[x].must_checked)return `<td class="small mut">${I('help','sm')} Chưa kiểm - bấm "Chấm lại" ở buổi này</td>`;
     return `<td class="small">${o.map(r=>{const [ic,cl,t]=st[r.status]||st.unknown;return `<div class="${cl}" style="margin:2px 0${r.status==='partial'?';color:var(--warn)':''}" title="${t}">${I(ic,'sm')} ${esc(r.requirement)}</div>`}).join('')
       ||`<span style="color:var(--ok)">${I('check','sm')} Đạt hết</span>`}</td>`}).join('')}</tr>`:''}
   <tr><td class="mut small">Một dòng</td>${names.map(x=>`<td class="small">${esc(c.overall[x].headline)}<br><a class="small" href="#/s/${c.overall[x].session_id}">xem buổi ›</a></td>`).join('')}</tr></table></div>
  <div class="grid2" style="margin-top:18px">
   <div class="card"><div class="card-h">${I('scale')}<h2>Xếp hạng</h2></div>${n.ranking.sort((a,b)=>a.rank-b.rank).map(r=>`<div class="comp"><div class="ch"><b>#${r.rank} · ${esc(r.candidate)}</b></div><div class="small" style="margin:6px 0">${esc(r.rationale)}</div>
     <div class="xs"><span style="color:var(--ok)">▲ ${r.best_at.map(esc).join(', ')}</span><br><span style="color:var(--err)">▼ ${r.weakest_at.map(esc).join(', ')}</span></div></div>`).join('')}</div>
   <div class="card"><div class="card-h">${I('spark')}<h2>Khuyến nghị</h2></div><p style="margin:0">${esc(n.recommendation)}</p>
     <h3>Đánh đổi</h3><ul class="ul">${n.tradeoffs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
     <h3>Rủi ro của quyết định &amp; cách giảm</h3><ul class="ul">${n.decision_risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
  $('rf').onclick=()=>compare(app,pid,true);
}
</script></body></html>
